name: CLI runtime bundle consumer

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: 'Optional unique ku-vVERSION-candidate-SHA12-NONCE draft; empty never uploads'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Optional unique ku-vVERSION-candidate-SHA12-NONCE draft; empty never uploads'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: cli-runtime-bundle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  candidate-release:
    if: inputs.candidate_tag != ''
    name: Create the explicit candidate draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create only this run's candidate draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("editors/vscode-ku/package.json"))["version"])')"
          python3 -B .github/scripts/release-transfer.py create \
            --repository "$GITHUB_REPOSITORY" --candidate-tag "$CANDIDATE_TAG" \
            --version "$version" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

  publisher-consumer:
    if: ${{ always() && (needs.candidate-release.result == 'success' || needs.candidate-release.result == 'skipped') }}
    needs: [candidate-release]
    name: Build and verify SDK ${{ matrix.target }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      INSTALLER_RUN_ID: ${{ github.run_id }}
      SDK_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read the single publisher toolchain configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = & ${{ matrix.python }} -B .github/scripts/runtime-bundle.py toolchain --repo .
          if ($LASTEXITCODE) { throw 'Project/publisher toolchain configuration mismatch' }
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE) { throw 'Publisher toolchain installation failed' }
          "KU_RELEASE_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check the CLI and manifest contracts
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'cli-contract-target'
          cargo +$env:KU_RELEASE_TOOLCHAIN fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Rust formatting failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Workspace check/clippy failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN build --locked --lib --bin ku
          if ($LASTEXITCODE) { throw 'Matching source CLI/library build failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test cli_v002_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Real CLI integration failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib cli_contract -- --test-threads=1
          if ($LASTEXITCODE) { throw 'CLI contract tests failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib runner_bundle -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Runner manifest tests failed' }
          & ${{ matrix.python }} -B .github/scripts/test-export-release.py
          if ($LASTEXITCODE) { throw 'Exporter contract tests failed' }
          & ${{ matrix.python }} -B .github/scripts/test-prepare-release.py
          if ($LASTEXITCODE) { throw 'Final release/transfer contract tests failed' }
      - name: Build the real isolated same-batch installer tree
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/package-release.ps1
      - name: Export the final source-free archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content editors/vscode-ku/package.json -Raw | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $metadataPath = Join-Path $env:RUNNER_TEMP 'bundle-cargo-metadata.json'
          $metadata = & cargo +$env:KU_RELEASE_TOOLCHAIN metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Metadata failed' }
          $metadata | Out-File -FilePath $metadataPath -Encoding utf8
          $sysroot = & rustc +$env:KU_RELEASE_TOOLCHAIN --print sysroot
          if ($LASTEXITCODE) { throw 'Publisher sysroot missing' }
          & ${{ matrix.python }} -B .github/scripts/export-release.py --bundle "release/${{ matrix.target }}" --output "$env:RUNNER_TEMP/cli-bundle-assets" --repo . --version $version --target '${{ matrix.target }}' --commit $env:GITHUB_SHA --metadata $metadataPath --rust-sysroot $sysroot.Trim()
          if ($LASTEXITCODE) { throw 'Actual archive validation failed' }
      - name: Install the unlike consumer Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Consumer toolchain unavailable' }
      - name: Verify the source-free installer and its actual installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/cli-bundle-assets" -Filter '*.tar.gz' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one same-batch installer' }
          & ${{ matrix.python }} -B .github/scripts/consume-runtime-bundle.py --archive $archive[0].FullName --manifest ($archive[0].FullName + '.manifest.json') --repo . --output "$env:RUNNER_TEMP/cli-consumer-evidence.json" --consumer-toolchain 1.96.0 --hide-checkout --installer-run $env:INSTALLER_RUN_ID --expected-sdk-commit $env:SDK_SOURCE_COMMIT
          if ($LASTEXITCODE) { throw 'Installed SDK verification failed' }
      - name: Prepare the existing PostgreSQL fixture tools on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql
          source_lib="$(pg_config --libdir)/libpq.so"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.so"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          pg_config --version

      - name: Prepare the existing PostgreSQL fixture tools on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install libpq postgresql@17
          source_lib="$(brew --prefix libpq)/lib/libpq.dylib"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.dylib"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          printf '%s\n' "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix postgresql@17)/bin/pg_config" --version

      - name: Prepare the existing PostgreSQL fixture tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or
              -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) {
            throw 'The Windows runner did not provide an absolute PGROOT'
          }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $importLibrary = Join-Path $selected 'lib\libpq.lib'
          $runtimeDirectory = Join-Path $selected 'bin'
          foreach ($tool in @('pg_config.exe', 'initdb.exe', 'pg_ctl.exe', 'psql.exe', 'libpq.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDirectory $tool) -PathType Leaf)) {
              throw "The selected PostgreSQL install is missing $tool"
            }
          }
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf)) {
            throw 'The selected PostgreSQL install is missing libpq.lib'
          }
          $privateLib = Join-Path $env:RUNNER_TEMP ('ku-installed-pg-link-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateLib | Out-Null
          Copy-Item -LiteralPath $importLibrary -Destination (Join-Path $privateLib 'libpq.lib')
          "KU_PG_LIB=$privateLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_PG_RUNTIME_DIR=$runtimeDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $runtimeDirectory 'pg_config.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected pg_config failed' }

      - name: Verify the same archive's installed sync and async PostgreSQL lifecycles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ${{ matrix.python }} -B .github/scripts/verify-installed-pg.py `
            --repo $env:GITHUB_WORKSPACE --version $env:RELEASE_VERSION `
            --target '${{ matrix.target }}' --commit $env:GITHUB_SHA `
            --output (Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json') `
            --assets (Join-Path $env:RUNNER_TEMP 'cli-bundle-assets')
          if ($LASTEXITCODE) { throw 'Actual installed CLI PostgreSQL acceptance failed' }
      - name: Upload only verified installation files to the explicit candidate draft
        if: inputs.candidate_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          & ${{ matrix.python }} -B .github/scripts/release-transfer.py upload `
            --repository $env:GITHUB_REPOSITORY --candidate-tag $env:CANDIDATE_TAG `
            --version $env:RELEASE_VERSION --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID `
            --target '${{ matrix.target }}' --directory (Join-Path $env:RUNNER_TEMP 'cli-bundle-assets')
          if ($LASTEXITCODE) { throw 'Candidate draft asset transfer failed' }
      - name: Summarize bounded SDK and installed-PG verification
        if: always()
        shell: pwsh
        run: |
          & ${{ matrix.python }} -B .github/scripts/release-transfer.py summary `
            --path (Join-Path $env:RUNNER_TEMP 'cli-consumer-evidence.json') `
            --path (Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json')
          if ($LASTEXITCODE) { throw 'Cannot summarize installation verification' }
      - name: Remove the owned PostgreSQL import-library link directory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:KU_PG_LIB)) {
            $parent = [IO.Path]::GetFullPath((Split-Path -Path $env:KU_PG_LIB -Parent))
            $expected = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $leaf = Split-Path -Path $env:KU_PG_LIB -Leaf
            if ($parent -ne $expected -or $leaf -notlike 'ku-installed-pg-link-*') {
              throw 'Refusing to clean an unowned PostgreSQL import-library path'
            }
            Remove-Item -LiteralPath $env:KU_PG_LIB -Recurse -Force
          }
