name: CLI runtime bundle consumer

on:
  workflow_call:
    inputs:
      platform_set:
        description: Official targets, Windows GNU only, or all four
        required: false
        default: official
        type: string
      candidate_tag:
        description: 'Optional unique ku-vVERSION-candidate-SHA12-NONCE draft; empty never uploads'
        required: false
        default: ''
        type: string
      early_loader_probe:
        description: Diagnose the GNU producer's installed calendar loader before full contracts
        required: false
        default: false
        type: boolean
      installed_pg_only:
        description: Recheck only the GNU installed PostgreSQL contract; not full SDK acceptance
        required: false
        default: false
        type: boolean
      installed_structured_only:
        description: Verify the installed structured Task example on native and Runner
        required: false
        default: false
        type: boolean
      installed_tasks_only:
        description: Verify the installed HTTP + PostgreSQL task-list example
        required: false
        default: false
        type: boolean
      installed_tasks_backend:
        description: Backend for installed_tasks_only (native or runner)
        required: false
        default: native
        type: string
  workflow_dispatch:
    inputs:
      platform_set:
        description: Select only the platform work required by this run
        required: false
        default: official
        type: choice
        options: [official, macos, windows-gnu, windows, all]
      candidate_tag:
        description: 'Optional unique ku-vVERSION-candidate-SHA12-NONCE draft; empty never uploads'
        required: false
        default: ''
        type: string
      early_loader_probe:
        description: Diagnose the GNU producer's installed calendar loader before full contracts
        required: false
        default: false
        type: boolean
      installed_pg_only:
        description: Recheck only the GNU installed PostgreSQL contract; not full SDK acceptance
        required: false
        default: false
        type: boolean
      installed_structured_only:
        description: Verify the installed structured Task example on native and Runner
        required: false
        default: false
        type: boolean
      installed_tasks_only:
        description: Verify the installed HTTP + PostgreSQL task-list example
        required: false
        default: false
        type: boolean
      installed_tasks_backend:
        description: Backend for the installed task-list example
        required: false
        default: native
        type: choice
        options: [native, runner]

permissions:
  contents: read

concurrency:
  group: cli-runtime-bundle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  candidate-release:
    if: inputs.candidate_tag != '' && !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only
    name: Create the explicit candidate draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create only this run's candidate draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("editors/vscode-ku/package.json"))["version"])')"
          python3 -B .github/scripts/release-transfer.py create \
            --repository "$GITHUB_REPOSITORY" --candidate-tag "$CANDIDATE_TAG" \
            --version "$version" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

  publisher-consumer:
    if: ${{ always() && (needs.candidate-release.result == 'success' || needs.candidate-release.result == 'skipped') }}
    needs: [candidate-release]
    name: Build and verify SDK ${{ matrix.target }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform_set == 'macos' && '[{"os":"macos-15","target":"aarch64-apple-darwin","python":"python3"}]' || inputs.platform_set == 'windows-gnu' && '[{"os":"windows-2025","target":"x86_64-pc-windows-gnu","python":"python"}]' || inputs.platform_set == 'windows' && '[{"os":"windows-2025","target":"x86_64-pc-windows-msvc","python":"python"},{"os":"windows-2025","target":"x86_64-pc-windows-gnu","python":"python"}]' || inputs.platform_set == 'all' && '[{"os":"windows-2025","target":"x86_64-pc-windows-msvc","python":"python"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","python":"python3"},{"os":"macos-15","target":"aarch64-apple-darwin","python":"python3"},{"os":"windows-2025","target":"x86_64-pc-windows-gnu","python":"python"}]' || '[{"os":"windows-2025","target":"x86_64-pc-windows-msvc","python":"python"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","python":"python3"},{"os":"macos-15","target":"aarch64-apple-darwin","python":"python3"}]') }}
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      INSTALLER_RUN_ID: ${{ github.run_id }}
      SDK_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Validate the selected installation verification scope
        shell: pwsh
        env:
          KU_INSTALLED_PG_ONLY: ${{ inputs.installed_pg_only }}
          KU_INSTALLED_STRUCTURED_ONLY: ${{ inputs.installed_structured_only }}
          KU_INSTALLED_TASKS_ONLY: ${{ inputs.installed_tasks_only }}
          KU_INSTALLED_TASKS_BACKEND: ${{ inputs.installed_tasks_backend }}
          KU_SELECTED_PLATFORM_SET: ${{ inputs.platform_set }}
          KU_SELECTED_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          KU_EARLY_LOADER_PROBE: ${{ inputs.early_loader_probe }}
        run: |
          if ($env:KU_INSTALLED_PG_ONLY -eq 'true' -and
              ($env:KU_SELECTED_PLATFORM_SET -ne 'windows-gnu' -or
               -not [string]::IsNullOrEmpty($env:KU_SELECTED_CANDIDATE_TAG))) {
            throw 'installed_pg_only requires windows-gnu and an empty candidate_tag; partial acceptance cannot upload or publish'
          }
          if ($env:KU_INSTALLED_STRUCTURED_ONLY -eq 'true' -and
              ($env:KU_INSTALLED_PG_ONLY -eq 'true' -or $env:KU_EARLY_LOADER_PROBE -eq 'true' -or
               -not [string]::IsNullOrEmpty($env:KU_SELECTED_CANDIDATE_TAG))) {
            throw 'installed_structured_only cannot run other probes or upload a candidate'
          }
          if ($env:KU_INSTALLED_TASKS_ONLY -eq 'true' -and
              ($env:KU_INSTALLED_PG_ONLY -eq 'true' -or $env:KU_INSTALLED_STRUCTURED_ONLY -eq 'true' -or
               $env:KU_EARLY_LOADER_PROBE -eq 'true' -or -not [string]::IsNullOrEmpty($env:KU_SELECTED_CANDIDATE_TAG))) {
            throw 'installed_tasks_only cannot run other probes or upload a candidate'
          }
          if ($env:KU_INSTALLED_TASKS_BACKEND -cnotin @('native', 'runner') -or
              ($env:KU_INSTALLED_TASKS_BACKEND -eq 'runner' -and $env:KU_INSTALLED_TASKS_ONLY -ne 'true')) {
            throw 'installed_tasks_backend must be native or select runner with installed_tasks_only'
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify the existing Python runtime
        shell: pwsh
        run: |
          & ${{ matrix.python }} --version
          if ($LASTEXITCODE) { throw 'Python version query failed' }
          & ${{ matrix.python }} -c "import sys; assert sys.version_info >= (3, 11), 'SDK verification requires Python 3.11 or later'"
          if ($LASTEXITCODE) { throw 'The existing runner Python cannot execute the installed-SDK verification' }
      - name: Select the existing x64 MinGW compiler for Windows GNU
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @('C:\mingw64\bin\gcc.exe', 'C:\msys64\mingw64\bin\gcc.exe', 'C:\tools\mingw64\bin\gcc.exe')
          $fromPath = Get-Command gcc -ErrorAction SilentlyContinue
          if ($fromPath) { $candidates += $fromPath.Source }
          $compiler = $null
          foreach ($candidate in $candidates | Select-Object -Unique) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $machine = & $candidate -dumpmachine
              if ($LASTEXITCODE -eq 0 -and $machine.Trim() -eq 'x86_64-w64-mingw32') { $compiler = (Resolve-Path -LiteralPath $candidate).Path; break }
            }
          }
          if (-not $compiler) { throw 'The runner has no matching preinstalled x64 MinGW GCC; no implicit tool installation is allowed' }
          $bin = Split-Path $compiler
          foreach ($tool in @('g++.exe', 'ar.exe', 'windres.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $tool) -PathType Leaf)) { throw "The selected MinGW toolchain is incomplete: $tool" }
          }
          $bin >> $env:GITHUB_PATH
          "KU_GNU_CC=$compiler" >> $env:GITHUB_ENV
          "KU_CC=$compiler" >> $env:GITHUB_ENV
          & $compiler --version
          & (Join-Path $bin 'g++.exe') -dumpmachine
      - name: Check the optional GNU loader probe before building its SDK
        if: inputs.early_loader_probe && !inputs.installed_pg_only && matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          & ${{ matrix.python }} -B .github/scripts/test-export-release.py RuntimeConsumerReportTests.test_gnu_pe_imports_use_sibling_tool_and_record_non_system_dependency_chain RuntimeConsumerReportTests.test_gnu_pe_import_probe_restores_existing_capture_limit_on_failure RuntimeConsumerReportTests.test_selected_gnu_loader_tool_and_real_environment_snapshot_are_ready RuntimeConsumerReportTests.test_gnu_static_executable_keeps_an_explicit_external_dll_import RuntimeConsumerReportTests.test_native_build_diagnostics_reject_crt_warnings_on_either_stream_even_at_exit_zero
          if ($LASTEXITCODE) { throw 'GNU loader probe preflight failed before the SDK build' }
      - name: Build the private pinned optional compression packs
        if: ${{ !inputs.installed_structured_only && !inputs.installed_tasks_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ku-native-compression-private'
          if (Test-Path -LiteralPath $root) { throw 'Private compression build root unexpectedly exists' }
          "KU_NATIVE_COMPRESSION_ROOT=$root" >> $env:GITHUB_ENV
          & ${{ matrix.python }} -B .github/scripts/build-native-compression.py --root $root --target '${{ matrix.target }}' --fetch
          if ($LASTEXITCODE) { throw 'Private pinned compression dependency build failed' }
      - name: Read the single publisher toolchain configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = & ${{ matrix.python }} -B .github/scripts/runtime-bundle.py toolchain --repo .
          if ($LASTEXITCODE) { throw 'Project/publisher toolchain configuration mismatch' }
          $publisher = if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu') { "$toolchain-x86_64-pc-windows-gnu" } else { $toolchain }
          rustup toolchain install $publisher --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE) { throw 'Publisher toolchain installation failed' }
          "KU_RELEASE_TOOLCHAIN=$publisher" >> $env:GITHUB_ENV
          & rustc +$publisher -vV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the real GNU installer before its contract consumers
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/package-release.ps1 -Target '${{ matrix.target }}'
      - name: Probe the GNU calendar loader before full contracts
        if: inputs.early_loader_probe && !inputs.installed_pg_only && matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          & ${{ matrix.python }} -B .github/scripts/consume-runtime-bundle.py --native-time-array-probe-bundle 'release/${{ matrix.target }}' --repo . --output "$env:RUNNER_TEMP/gnu-loader-probe.json" --expected-sdk-commit $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Early GNU calendar loader probe failed; inspect the preserved bounded report' }
      - name: Summarize the optional GNU loader probe
        if: always() && inputs.early_loader_probe && !inputs.installed_pg_only && matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gnu-loader-probe.json'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $text = Get-Content -LiteralPath $path -Raw
            if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 65536) { throw 'GNU loader probe metadata exceeds its output bound' }
            Write-Output "GNU loader probe report: $text"
          } else { Write-Output 'GNU loader probe did not create a report; inspect the producer/probe failure above.' }
      - name: Check the CLI and manifest contracts
        if: ${{ !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only }}
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'cli-contract-target'
          cargo +$env:KU_RELEASE_TOOLCHAIN fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Rust formatting failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Workspace check/clippy failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked -p ku-native-calendar
          if ($LASTEXITCODE) { throw 'Native calendar engine/ABI contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked -p ku-native-http-client
          if ($LASTEXITCODE) { throw 'Native HTTP async codec/TLS/ABI contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN build --locked --lib --bin ku
          if ($LASTEXITCODE) { throw 'Matching source CLI/library build failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test cli_v002_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Real CLI integration failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test language_v004_test --test language_v010_test --test native_async_boundary_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Default native project/import and explicit Runner contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib cli_contract -- --test-threads=1
          if ($LASTEXITCODE) { throw 'CLI contract tests failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib runner_bundle -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Runner manifest tests failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib windows_gnu_static_runtime_link_policy -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Target-pinned GNU runtime argv contract failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --lib configured_c_compiler_target_probe_failure -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Explicit native compiler probe error contract failed' }
          & ${{ matrix.python }} -B .github/scripts/test-export-release.py
          if ($LASTEXITCODE) { throw 'Exporter contract tests failed' }
          & ${{ matrix.python }} -B .github/scripts/test-build-native-compression.py
          if ($LASTEXITCODE) { throw 'Optional compression pack contract tests failed' }
          & ${{ matrix.python }} -B .github/scripts/test-prepare-release.py
          if ($LASTEXITCODE) { throw 'Final release/transfer contract tests failed' }
          & ${{ matrix.python }} -B .github/scripts/test-prepare-windows-gnu-pg.py
          if ($LASTEXITCODE) { throw 'Private GNU libpq input/dependency contracts failed' }
          & ${{ matrix.python }} -B tests/acceptance/test_http_pg_lifecycle.py WindowsGnuPrivateRuntimeContracts
          if ($LASTEXITCODE) { throw 'Private GNU service PATH/provider identity contracts failed' }
      - name: Build the real isolated same-batch installer tree
        if: matrix.target != 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/package-release.ps1 -Target '${{ matrix.target }}'
      - name: Verify native HTTP, loop, Unicode and codec contracts with C11 O2
        if: ${{ !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'cli-contract-target'
          $env:KU_BIN = Join-Path $env:CARGO_TARGET_DIR $(if ($IsWindows) { 'debug/ku.exe' } else { 'debug/ku' })
          if (-not (Test-Path -LiteralPath $env:KU_BIN -PathType Leaf)) { throw 'Same-batch source test CLI is missing' }
          # These existing C harnesses accept GCC-driver syntax. Use the
          # runner's existing clang; do not install or replace a compiler.
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu') {
            & $env:KU_GNU_CC --version
            if ($LASTEXITCODE) { throw 'Selected GNU compiler is unavailable' }
            $env:KU_CC = $env:KU_GNU_CC + ' -O2'
          } else {
            & clang --version
            if ($LASTEXITCODE) { throw 'The existing clang driver is required by the native C harnesses' }
            $env:KU_CC = 'clang -O2'
          }
          $env:KU_NATIVE_CALENDAR_PACK = Join-Path (Get-Location) 'release/${{ matrix.target }}/native-calendar/v1/${{ matrix.target }}'
          $env:KU_NATIVE_HTTP_CLIENT_PACK = Join-Path (Get-Location) 'release/${{ matrix.target }}/native-http/v1/${{ matrix.target }}'
          $packs = Join-Path $env:KU_NATIVE_COMPRESSION_ROOT 'native-compression/v1/${{ matrix.target }}'
          $env:KU_ZSTD_LIB = Join-Path $packs 'zstd/lib'
          $env:KU_ZSTD_INCLUDE = Join-Path $packs 'zstd/include'
          $env:KU_ZLIB_LIB = Join-Path $packs 'zlib/lib'
          $env:KU_ZLIB_INCLUDE = Join-Path $packs 'zlib/include'
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_status_test --test native_loop_control_test --test native_unicode_string_test --test native_compression_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native HTTP/loop/Unicode/codec contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_collection_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native collection/nullable contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_task_adapter_test native_task_nullable_array_owners_release_after_cancel_oom_and_budget_failure -- --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Task nullable cancellation/allocation/budget cleanup failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_run_test native_time -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native previous time module contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_run_test native_calendar -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native calendar module contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_test native_calendar -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native calendar HTTP recovery failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_client_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native HTTP client ownership/error/deadline contracts failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_test -- native_http_view_routes_dynamic_results_and_invalid_shape_recover native_http_task_dynamic_headers_survive_await_and_transfer_once --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Native View routes and Task dynamic headers failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_task_start_parameters_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Shared Task argument ownership/slot relocation failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_test native_http_inferred_object_handlers_preserve_callable_abi_and_owned_results -- --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Native structural HTTP handler ABI failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_test native_http_response_headers_are_authoritative_validated_and_sent_once -- --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Native response header ownership/framing failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_result_context_test -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native Result inference/owned-error cleanup failed' }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_run_test native_fs_base_is_executable_relative_relocatable_and_source_free -- --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Native Unicode source/output relocation failed' }
          if (-not $IsWindows) {
            $normalCompiler = $env:KU_CC
            try {
              $env:KU_CC = 'clang -O2 -fsanitize=address,undefined -fno-omit-frame-pointer'
              cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_collection_test nullable -- --test-threads=1
              if ($LASTEXITCODE) { throw 'Nullable ASan/UBSan cleanup failed' }
              cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_task_adapter_test native_task_nullable_array_owners_release_after_cancel_oom_and_budget_failure -- --exact --test-threads=1
              if ($LASTEXITCODE) { throw 'Task nullable ASan/UBSan cleanup failed' }
              cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_run_test native_calendar -- --test-threads=1
              if ($LASTEXITCODE) { throw 'Calendar ASan/UBSan cleanup failed' }
              cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_client_test -- --test-threads=1
              if ($LASTEXITCODE) { throw 'HTTP response/ABI ASan/UBSan cleanup failed' }
              cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_http_test -- native_http_view_routes_dynamic_results_and_invalid_shape_recover native_http_task_dynamic_headers_survive_await_and_transfer_once --exact --test-threads=1
              if ($LASTEXITCODE) { throw 'View/Task HTTP ASan/UBSan ownership failed' }
            } finally { $env:KU_CC = $normalCompiler }
          }
          cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_compression_test native_compression_public_project_runs_outside_source_with_space_and_unicode -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Actual public three-codec C11 O2 project failed' }
          if (-not $IsWindows) {
            # One argv per line preserves space/Unicode paths; these absolute
            # archives are the same verified private packs exported below.
            $env:KU_COMPRESSION_TEST_CC = 'clang'
            $env:KU_COMPRESSION_TEST_LINK_ARGS = @(
              ('-I' + $env:KU_ZSTD_INCLUDE), ('-I' + $env:KU_ZLIB_INCLUDE),
              (Join-Path $env:KU_ZSTD_LIB 'libzstd.a'), (Join-Path $env:KU_ZLIB_LIB 'libz.a')
            ) -join "`n"
            cargo +$env:KU_RELEASE_TOOLCHAIN test --locked --test native_compression_test native_compression_bounds_members_and_allocation_failures_release_owned_storage -- --ignored --exact --test-threads=1
            if ($LASTEXITCODE) { throw 'Codec malformed-input/bounds/allocation-failure cleanup failed' }
          } else {
            Write-Output 'Windows: actual CLI/public codec execution above; the POSIX allocator C fixture is not claimed as executed with the MSVC /MD pack.'
          }
      - name: Export the final source-free archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content editors/vscode-ku/package.json -Raw | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $metadataPath = Join-Path $env:RUNNER_TEMP 'bundle-cargo-metadata.json'
          $metadata = & cargo +$env:KU_RELEASE_TOOLCHAIN metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Metadata failed' }
          $metadata | Out-File -FilePath $metadataPath -Encoding utf8
          $sysroot = & rustc +$env:KU_RELEASE_TOOLCHAIN --print sysroot
          if ($LASTEXITCODE) { throw 'Publisher sysroot missing' }
          $compression = @()
          if ($env:KU_NATIVE_COMPRESSION_ROOT) { $compression = @('--native-compression-root', $env:KU_NATIVE_COMPRESSION_ROOT) }
          & ${{ matrix.python }} -B .github/scripts/export-release.py --bundle "release/${{ matrix.target }}" --output "$env:RUNNER_TEMP/cli-bundle-assets" --repo . --version $version --target '${{ matrix.target }}' --commit $env:GITHUB_SHA --metadata $metadataPath --rust-sysroot $sysroot.Trim() @compression
          if ($LASTEXITCODE) { throw 'Actual archive validation failed' }
      - name: Install the unlike consumer Rust toolchain
        if: ${{ !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only }}
        shell: pwsh
        run: |
          $consumer = if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu') { '1.96.0-x86_64-pc-windows-gnu' } else { '1.96.0' }
          rustup toolchain install $consumer --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Consumer toolchain unavailable' }
          "KU_CONSUMER_TOOLCHAIN=$consumer" >> $env:GITHUB_ENV
      - name: Verify the source-free installer and its actual installation
        if: ${{ !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/cli-bundle-assets" -Filter '*.tar.gz' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one same-batch installer' }
          & ${{ matrix.python }} -B .github/scripts/consume-runtime-bundle.py --archive $archive[0].FullName --manifest ($archive[0].FullName + '.manifest.json') --repo . --output "$env:RUNNER_TEMP/cli-consumer-evidence.json" --consumer-toolchain $env:KU_CONSUMER_TOOLCHAIN --hide-checkout --installer-run $env:INSTALLER_RUN_ID --expected-sdk-commit $env:SDK_SOURCE_COMMIT
          if ($LASTEXITCODE) { throw 'Installed SDK verification failed' }
          $installed = Get-Content -LiteralPath "$env:RUNNER_TEMP/cli-consumer-evidence.json" -Raw | ConvertFrom-Json
          if ($installed.installed_native_time_array.status -ne 'passed') { throw 'This SDK must include and actually execute the matching native calendar/array modules' }
          if ($installed.installed_native_http_client.status -ne 'passed') { throw 'This SDK must include and actually execute the matching native HTTP/calendar client program' }
          if ($installed.installed_native_task_http_client.status -ne 'passed') { throw 'This SDK must execute standalone Task HTTP without a server or Runner' }
          if ($installed.installed_native_http_relay.status -ne 'passed') { throw 'This SDK must actually execute the source-free inbound HTTP to outbound HTTP relay contract' }
      - name: Run the same installed structured Task example using both backends
        if: inputs.installed_structured_only
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/cli-bundle-assets" -Filter '*.tar.gz' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one same-batch installer' }
          & ${{ matrix.python }} -B .github/scripts/consume-runtime-bundle.py --structured-only --archive $archive[0].FullName --manifest ($archive[0].FullName + '.manifest.json') --repo . --output "$env:RUNNER_TEMP/cli-structured-evidence.json" --installer-run $env:INSTALLER_RUN_ID --expected-sdk-commit $env:SDK_SOURCE_COMMIT
          if ($LASTEXITCODE) { throw 'Installed structured Task example failed' }
      - name: Prepare the existing PostgreSQL fixture tools on Linux
        if: runner.os == 'Linux' && !inputs.installed_structured_only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql
          source_lib="$(pg_config --libdir)/libpq.so"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.so"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          pg_config --version

      - name: Prepare the existing PostgreSQL fixture tools on macOS
        if: runner.os == 'macOS' && !inputs.installed_structured_only
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install libpq postgresql@17
          source_lib="$(brew --prefix libpq)/lib/libpq.dylib"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.dylib"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          printf '%s\n' "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix postgresql@17)/bin/pg_config" --version

      - name: Prepare the existing PostgreSQL fixture tools on Windows
        if: runner.os == 'Windows' && matrix.target != 'x86_64-pc-windows-gnu' && !inputs.installed_structured_only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or
              -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) {
            throw 'The Windows runner did not provide an absolute PGROOT'
          }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $importLibrary = Join-Path $selected 'lib\libpq.lib'
          $runtimeDirectory = Join-Path $selected 'bin'
          foreach ($tool in @('pg_config.exe', 'initdb.exe', 'pg_ctl.exe', 'psql.exe', 'libpq.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDirectory $tool) -PathType Leaf)) {
              throw "The selected PostgreSQL install is missing $tool"
            }
          }
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf)) {
            throw 'The selected PostgreSQL install is missing libpq.lib'
          }
          $privateLib = Join-Path $env:RUNNER_TEMP ('ku-installed-pg-link-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateLib | Out-Null
          Copy-Item -LiteralPath $importLibrary -Destination (Join-Path $privateLib 'libpq.lib')
          "KU_PG_LIB=$privateLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_PG_RUNTIME_DIR=$runtimeDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $runtimeDirectory 'pg_config.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected pg_config failed' }

      - name: Prepare private Windows GNU libpq imports and exact runtime DLLs
        if: matrix.target == 'x86_64-pc-windows-gnu' && !inputs.installed_structured_only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) { throw 'Windows GNU PG verification requires the existing absolute PGROOT' }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $tools = Join-Path $selected 'bin'
          foreach ($name in @('postgres.exe', 'pg_config.exe', 'initdb.exe', 'pg_ctl.exe', 'psql.exe', 'libpq.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tools $name) -PathType Leaf)) { throw "The selected private PG fixture provider is missing $name" }
          }
          $privateLib = Join-Path $env:RUNNER_TEMP ('ku-installed-pg-link-' + [Guid]::NewGuid().ToString('N'))
          "KU_PG_LIB=$privateLib" >> $env:GITHUB_ENV
          "KU_PG_RUNTIME_DIR=$(Join-Path $privateLib 'runtime')" >> $env:GITHUB_ENV
          "KU_PG_PRIVATE_MANIFEST=$(Join-Path $privateLib 'manifest.json')" >> $env:GITHUB_ENV
          "KU_PG_TOOL_DIR=$tools" >> $env:GITHUB_ENV
          & ${{ matrix.python }} -B .github/scripts/prepare-windows-gnu-pg.py --compiler $env:KU_GNU_CC --postgres-root $selected --output $privateLib
          if ($LASTEXITCODE) { throw 'Actual GNU libpq import-library/runtime closure preparation failed' }
      - name: Verify the archive's selected installed PostgreSQL contract
        if: ${{ !inputs.installed_structured_only }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          KU_INSTALLED_TASKS_ONLY: ${{ inputs.installed_tasks_only }}
          KU_INSTALLED_TASKS_BACKEND: ${{ inputs.installed_tasks_backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgExtra = @()
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu' -or $env:KU_INSTALLED_TASKS_BACKEND -eq 'runner') {
            $pgExtra += '--hide-checkout'
          }
          if ($env:KU_INSTALLED_TASKS_ONLY -eq 'true') {
            $pgExtra += @('--tasks-example', '--tasks-backend', $env:KU_INSTALLED_TASKS_BACKEND)
          }
          & ${{ matrix.python }} -B (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/verify-installed-pg.py') `
            --repo $env:GITHUB_WORKSPACE --version $env:RELEASE_VERSION `
            --target '${{ matrix.target }}' --commit $env:GITHUB_SHA `
            --output (Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json') `
            --assets (Join-Path $env:RUNNER_TEMP 'cli-bundle-assets') @pgExtra
          if ($LASTEXITCODE) { throw 'Actual installed CLI PostgreSQL acceptance failed' }
      - name: Upload only verified installation files to the explicit candidate draft
        if: inputs.candidate_tag != '' && !inputs.installed_pg_only && !inputs.installed_structured_only && !inputs.installed_tasks_only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          & ${{ matrix.python }} -B .github/scripts/release-transfer.py upload `
            --repository $env:GITHUB_REPOSITORY --candidate-tag $env:CANDIDATE_TAG `
            --version $env:RELEASE_VERSION --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID `
            --target '${{ matrix.target }}' --directory (Join-Path $env:RUNNER_TEMP 'cli-bundle-assets')
          if ($LASTEXITCODE) { throw 'Candidate draft asset transfer failed' }
      - name: Summarize bounded SDK and installed-PG verification
        if: always() && !inputs.installed_structured_only && !inputs.installed_tasks_only
        shell: pwsh
        run: |
          $pgOnly = '${{ inputs.installed_pg_only }}' -eq 'true'
          $scope = if ($pgOnly) { 'GNU installed-PG partial recheck; not full SDK acceptance' } else { 'Full selected-target SDK acceptance' }
          Write-Output "Verification scope: $scope"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Verification scope: $scope"
          $summaryArgs = @('-B', '.github/scripts/release-transfer.py', 'summary')
          if (-not $pgOnly) { $summaryArgs += @('--path', (Join-Path $env:RUNNER_TEMP 'cli-consumer-evidence.json')) }
          $summaryArgs += @('--path', (Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json'))
          & ${{ matrix.python }} @summaryArgs
          if ($LASTEXITCODE) { throw 'Cannot summarize installation verification' }
          $path = Join-Path $env:RUNNER_TEMP 'cli-consumer-evidence.json'
          if (Test-Path -LiteralPath $path) {
            $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $native = [ordered]@{target='${{ matrix.target }}'; installed_native_tls=$evidence.installed_native_tls; installed_native_compression=$evidence.installed_native_compression; installed_native_time_array=$evidence.installed_native_time_array; installed_native_http_client=$evidence.installed_native_http_client; installed_native_task_http_client=$evidence.installed_native_task_http_client; installed_native_http_relay=$evidence.installed_native_http_relay}
            $text = ConvertTo-Json -InputObject $native -Depth 8 -Compress
            if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 32768) { throw 'Native consumer metadata exceeds summary bound' }
            Write-Output $text
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Native installed SDK checks: $text"
          }
          $pgPath = Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json'
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu' -and (Test-Path -LiteralPath $pgPath -PathType Leaf)) {
            $pg = Get-Content -LiteralPath $pgPath -Raw | ConvertFrom-Json
            $detail = [ordered]@{ verification_scope=$scope; target=$pg.target; status=$pg.status; profile=$pg.profile; commit=$pg.commit; executable_sha256=$pg.executable_sha256; checkout_hidden_during_pg=$pg.checkout_hidden_during_pg; checkout_restore_confirmed=$pg.checkout_restore_confirmed; temporary_cleanup_confirmed=$pg.temporary_cleanup_confirmed; fixture_cleanup_confirmed=$pg.fixture_cleanup_confirmed; lanes=$pg.lanes; runtime_inputs=$pg.gnu_runtime_inputs; failure_kind=$pg.failure_kind; failure_diagnostics=$pg.failure_diagnostics }
            $text = ConvertTo-Json -InputObject $detail -Depth 12 -Compress
            if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 65536) { throw 'GNU PG bounded metadata exceeds its output limit' }
            Write-Output "Installed GNU PG checks: $text"
          }
      - name: Summarize the installed PostgreSQL task-list example
        if: always() && inputs.installed_tasks_only
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $report = Get-Content -LiteralPath $path -Raw -Encoding utf8 | ConvertFrom-Json
            $summary = [ordered]@{ target=$report.target; commit=$report.commit; tasks_backend=$report.tasks_backend; status=$report.status; checkout_hidden_during_pg=$report.checkout_hidden_during_pg; checkout_restore_confirmed=$report.checkout_restore_confirmed; temporary_cleanup_confirmed=$report.temporary_cleanup_confirmed; fixture_cleanup_confirmed=$report.fixture_cleanup_confirmed; example_results=$report.example_results; failure_kind=$report.failure_kind; failure_diagnostics=$report.failure_diagnostics }
            $text = ConvertTo-Json -InputObject $summary -Depth 10 -Compress
            if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 32768) { throw 'The task-list result exceeds the summary bound' }
            Write-Output $text
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $text
          } else {
            Write-Output 'Installed task-list verification did not start; see the preceding build steps.'
          }
      - name: Summarize the installed structured Task result
        if: always() && inputs.installed_structured_only
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cli-structured-evidence.json'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            $text = Get-Content -LiteralPath $path -Raw -Encoding utf8
            if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 32768) { throw 'Structured Task result exceeds summary bound' }
            Write-Output $text
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $text
          } else {
            Write-Output 'Installed structured Task consumer did not start; inspect the producer steps above.'
          }
      - name: Remove the owned private compression build root
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:KU_NATIVE_COMPRESSION_ROOT)) {
            $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'ku-native-compression-private'))
            if ([IO.Path]::GetFullPath($env:KU_NATIVE_COMPRESSION_ROOT) -ne $expected) { throw 'Refusing to clean an unowned compression build root' }
            if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          }
      - name: Remove the owned PostgreSQL import-library link directory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:KU_PG_LIB)) {
            $parent = [IO.Path]::GetFullPath((Split-Path -Path $env:KU_PG_LIB -Parent))
            $expected = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $leaf = Split-Path -Path $env:KU_PG_LIB -Leaf
            if ($parent -ne $expected -or $leaf -notlike 'ku-installed-pg-link-*') {
              throw 'Refusing to clean an unowned PostgreSQL import-library path'
            }
            if (Test-Path -LiteralPath $env:KU_PG_LIB) { Remove-Item -LiteralPath $env:KU_PG_LIB -Recurse -Force }
            if (Test-Path -LiteralPath $env:KU_PG_LIB) { throw 'Owned PostgreSQL link/runtime root remains after cleanup' }
            Write-Output "Owned PostgreSQL link/runtime cleanup confirmed: $env:KU_PG_LIB"
          }
