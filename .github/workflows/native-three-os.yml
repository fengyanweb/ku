name: Native three-OS gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-three-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust format, check and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and lint components
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustup component add rustfmt clippy --toolchain 1.89.0
          rustc --version --verbose

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check every workspace Cargo target
        run: cargo check --locked --workspace --all-targets

      - name: Reject clippy warnings in every workspace Cargo target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install the editor test Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Install VS Code extension dependencies from lockfile
        working-directory: editors/vscode-ku
        run: npm ci

      - name: Test VS Code extension models and formatter
        working-directory: editors/vscode-ku
        run: npm test

      - name: Test release archive validation and license collection
        run: |
          python3 -B .github/scripts/test-export-release.py
          python3 -B .github/scripts/test-prepare-release.py

  borrow-sanitizers:
    name: Native borrow ASan, UBSan and leak checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      KU_CC: "clang -fsanitize=address,undefined -fno-omit-frame-pointer -g -DKU_BORROW_REQUIRE_ASAN"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and require Clang
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          clang --version

      - name: Verify borrowed lifetimes, allocation ledger and source-free execution
        run: cargo test --locked --test borrow_allocation_test --test borrow_native_test -- --nocapture

  full-tests:
    name: ${{ matrix.os }} unfiltered workspace test suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            tls_target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            tls_target: x86_64-unknown-linux-gnu
          - os: macos-15
            tls_target: aarch64-apple-darwin
    env:
      CARGO_INCREMENTAL: "0"
      KU_NATIVE_TLS_LINK_REQUIRED: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup component add clippy --toolchain 1.89.0
          rustup default 1.89.0
          rustc --version --verbose

      - name: Prepare exact shared database client link inputs on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            default-libmysqlclient-dev libpq-dev pkg-config
          source_lib="$(pg_config --libdir)/libpq.so"
          test -e "$source_lib"
          pg_config --version
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-libpq-link.XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.so"
          test -L "$private_lib/libpq.so"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"

          if pkg-config --exists mysqlclient; then
            mysql_module=mysqlclient
            mysql_name=libmysqlclient.so
          elif pkg-config --exists mariadb; then
            mysql_module=mariadb
            mysql_name=libmariadb.so
          else
            echo 'No mysqlclient or mariadb pkg-config module was installed' >&2
            exit 1
          fi
          mysql_libdir="$(pkg-config --variable=libdir "$mysql_module")"
          mysql_include="$(pkg-config --variable=includedir "$mysql_module")"
          pkg-config --modversion "$mysql_module"
          test -e "$mysql_libdir/$mysql_name"
          test -f "$mysql_include/mysql.h" -o -f "$mysql_include/mysql/mysql.h"
          private_mysql="$(mktemp -d "$RUNNER_TEMP/ku-libmysql-link.XXXXXXXX")"
          chmod 700 "$private_mysql"
          ln -s "$mysql_libdir/$mysql_name" "$private_mysql/$mysql_name"
          test -L "$private_mysql/$mysql_name"
          printf 'KU_MYSQL_LIB=%s\n' "$private_mysql" >> "$GITHUB_ENV"
          printf 'KU_MYSQL_INCLUDE=%s\n' "$mysql_include" >> "$GITHUB_ENV"

      - name: Prepare exact shared database client link inputs on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install libpq mysql-client
          brew list --versions libpq mysql-client
          source_lib="$(brew --prefix libpq)/lib/libpq.dylib"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-libpq-link.XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.dylib"
          test -L "$private_lib/libpq.dylib"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"

          mysql_prefix="$(brew --prefix mysql-client)"
          mysql_lib="$mysql_prefix/lib/libmysqlclient.dylib"
          mysql_include="$mysql_prefix/include"
          test -e "$mysql_lib"
          test -f "$mysql_include/mysql.h" -o -f "$mysql_include/mysql/mysql.h"
          private_mysql="$(mktemp -d "$RUNNER_TEMP/ku-libmysql-link.XXXXXXXX")"
          chmod 700 "$private_mysql"
          ln -s "$mysql_lib" "$private_mysql/libmysqlclient.dylib"
          test -L "$private_mysql/libmysqlclient.dylib"
          printf 'KU_MYSQL_LIB=%s\n' "$private_mysql" >> "$GITHUB_ENV"
          printf 'KU_MYSQL_INCLUDE=%s\n' "$mysql_include" >> "$GITHUB_ENV"

      - name: Prepare an exact libpq import library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or
              -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) {
            throw "The Windows runner did not provide an absolute PGROOT"
          }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $importLibrary = Join-Path $selected 'lib\libpq.lib'
          $runtimeDirectory = Join-Path $selected 'bin'
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $runtimeDirectory 'libpq.dll') -PathType Leaf)) {
            throw "PGROOT does not contain libpq.lib and libpq.dll"
          }
          (Get-Item -LiteralPath (Join-Path $runtimeDirectory 'libpq.dll')).VersionInfo |
            Format-List FileVersion,ProductVersion
          $privateLib = Join-Path $env:RUNNER_TEMP ("ku-libpq-link-{0}" -f [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateLib | Out-Null
          $privateImport = Join-Path $privateLib 'libpq.lib'
          Copy-Item -LiteralPath $importLibrary -Destination $privateImport
          if (-not (Test-Path -LiteralPath $privateImport -PathType Leaf)) {
            throw 'Failed to create the private libpq import-library copy'
          }
          "KU_PG_LIB=$privateLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_PG_RUNTIME_DIR=$runtimeDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate the exact MySQL client import library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @()
          foreach ($candidate in @($env:MYSQL_ROOT, $env:MYSQL_PATH, 'C:\mysql', 'C:\tools\mysql')) {
            if (-not [string]::IsNullOrWhiteSpace($candidate) -and
                (Test-Path -LiteralPath $candidate -PathType Container)) {
              $item = Get-Item -LiteralPath $candidate
              $roots += $item
              if ($item.Name -ieq 'bin' -and $null -ne $item.Parent) {
                $roots += $item.Parent
              }
            }
          }
          $programFilesMySql = Join-Path $env:ProgramFiles 'MySQL'
          if (Test-Path -LiteralPath $programFilesMySql -PathType Container) {
            $roots += Get-ChildItem -LiteralPath $programFilesMySql -Directory
          }
          $selected = $roots |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\libmysql.lib') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\libmysql.dll') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'include\mysql.h') -PathType Leaf)
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $selected) {
            throw 'No complete MySQL client installation was found'
          }
          $mysqlLib = (Resolve-Path -LiteralPath (Join-Path $selected.FullName 'lib')).Path
          $mysqlInclude = (Resolve-Path -LiteralPath (Join-Path $selected.FullName 'include')).Path
          $mysqlImport = Join-Path $mysqlLib 'libmysql.lib'
          $privateMysql = Join-Path $env:RUNNER_TEMP ("ku-libmysql-link-{0}" -f [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateMysql | Out-Null
          $privateMysqlImport = Join-Path $privateMysql 'libmysql.lib'
          Copy-Item -LiteralPath $mysqlImport -Destination $privateMysqlImport
          if (-not (Test-Path -LiteralPath $privateMysqlImport -PathType Leaf)) {
            throw 'Failed to create the private MySQL import-library copy'
          }
          "KU_MYSQL_LIB=$privateMysql" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_MYSQL_INCLUDE=$mysqlInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_MYSQL_RUNTIME_LIB=$mysqlLib" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mysqlBin = Join-Path $selected.FullName 'bin'
          if (Test-Path -LiteralPath $mysqlBin -PathType Container) {
            $mysqlBin = (Resolve-Path -LiteralPath $mysqlBin).Path
            "KU_MYSQL_RUNTIME_BIN=$mysqlBin" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          (Get-Item -LiteralPath (Join-Path $mysqlLib 'libmysql.dll')).VersionInfo |
            Format-List FileVersion,ProductVersion

      - name: Build Ku CLI
        run: cargo build --locked --release --bin ku

      - name: Build and verify the native TLS target pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packRoot = Join-Path $env:RUNNER_TEMP 'ku-native-tls-pack-v1'
          & ./scripts/build-native-tls-pack.ps1 `
            -Target '${{ matrix.tls_target }}' `
            -OutputRoot $packRoot
          "KU_NATIVE_TLS_PACK=$packRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require a source-free native TLS C consumer
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_net_tls_c_links_runs_without_source_or_pack_and_preserves_binary \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native PostgreSQL client linking and startup
        if: runner.os != 'Windows'
        shell: bash
        env:
          KU_PG_LINK_REQUIRED: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then export LD_BIND_NOW=1; fi
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_BIND_AT_LAUNCH=1; fi
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_pg_client_c_links_and_starts_when_toolchain_and_libpq_are_available \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native PostgreSQL client linking and startup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KU_PG_LINK_REQUIRED: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked --release `
            --test native_run_test `
            native_pg_client_c_links_and_starts_when_toolchain_and_libpq_are_available `
            -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "native PostgreSQL exact-link test failed with exit code $LASTEXITCODE"
          }

      - name: Require native MySQL client linking and startup
        if: runner.os != 'Windows'
        shell: bash
        env:
          KU_MYSQL_LINK_REQUIRED: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then export LD_BIND_NOW=1; fi
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_BIND_AT_LAUNCH=1; fi
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_mysql_client_c_links_and_starts_when_toolchain_and_library_are_available \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native MySQL client linking and startup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KU_MYSQL_LINK_REQUIRED: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked --release `
            --test native_run_test `
            native_mysql_client_c_links_and_starts_when_toolchain_and_library_are_available `
            -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "native MySQL exact-link test failed with exit code $LASTEXITCODE"
          }

      - name: Reject platform-specific clippy warnings
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run every default test target without stopping at the first failure
        run: >-
          cargo test --locked --release --workspace --no-fail-fast
          -- --nocapture --test-threads=2

  release-contract:
    name: ${{ matrix.os }} release scripts and clean CheckOnly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustc --version --verbose

      - name: Install the release packaging Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Record the release packaging Node runtime
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"

      - name: Snapshot the clean checkout including ignored paths
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/ku-release-checkout-before.txt"
          git -c core.quotepath=false status \
            --porcelain=v1 --untracked-files=all --ignored=matching > "$before"
          if [ -s "$before" ]; then
            cat "$before" >&2
            exit 1
          fi

      - name: Exercise bounded release-process and crash-recovery contracts
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/package-release.ps1 -SelfTest

      - name: Build and validate the archive path without publishing
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/archive-release.ps1 -CheckOnly

      - name: Require CheckOnly to leave tracked, untracked and ignored paths unchanged
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/ku-release-checkout-before.txt"
          after="$RUNNER_TEMP/ku-release-checkout-after.txt"
          git -c core.quotepath=false status \
            --porcelain=v1 --untracked-files=all --ignored=matching > "$after"
          if ! cmp -s "$before" "$after"; then
            diff -u "$before" "$after" >&2
            exit 1
          fi

  native:
    name: ${{ matrix.target }} native build and run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-windows
            ku_binary: target/release/ku.exe
            python: python
            artifact: native_ci-x86_64-windows.exe
          - os: ubuntu-24.04
            target: x86_64-linux
            ku_binary: target/release/ku
            python: python3
            artifact: native_ci-x86_64-linux.tar
          - os: macos-15
            target: aarch64-darwin
            ku_binary: target/release/ku
            python: python3
            artifact: native_ci-aarch64-darwin.tar
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustc --version --verbose

      - name: Build Ku CLI
        run: cargo build --locked --release --bin ku

      - name: Test bounded native verification harness
        run: ${{ matrix.python }} -B .github/scripts/test-verify-native-three-os.py

      - name: Test isolated PostgreSQL fixture safety
        run: ${{ matrix.python }} -B .github/scripts/test-pg-loopback-fixture.py

      - name: Build and run target-native fixture
        run: >-
          ${{ matrix.python }} .github/scripts/verify-native-three-os.py
          --ku "${{ matrix.ku_binary }}"
          --target "${{ matrix.target }}"
          --artifact-dir "${{ runner.temp }}/ku-native-${{ matrix.target }}"

      - name: Upload verified portable native file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/ku-native-${{ matrix.target }}/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          archive: false

  release-bundle:
    name: ${{ matrix.target }} release download bundle
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0

      - name: Install the release packaging Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Validate the package version and any release tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath editors/vscode-ku/package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'The release package version must be canonical SemVer'
          }
          if ($env:GITHUB_REF_TYPE -ceq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The release tag must exactly match the package version'
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and verify the actual host bundle
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/package-release.ps1

      - name: Test the archive exporter on this platform
        run: ${{ matrix.python }} -B .github/scripts/test-export-release.py

      - name: Export a verified source-free archive and third-party notices
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataPath = Join-Path $env:RUNNER_TEMP 'ku-release-cargo-metadata.json'
          $metadata = & cargo metadata --locked --format-version 1 --filter-platform $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Cannot collect locked Cargo dependency metadata' }
          $metadata | Out-File -FilePath $metadataPath -Encoding utf8
          $sysroot = & rustc +1.89.0 --print sysroot
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate the pinned Rust license materials' }
          & ${{ matrix.python }} -B .github/scripts/export-release.py `
            --bundle (Join-Path $env:GITHUB_WORKSPACE "release/$env:RELEASE_TARGET") `
            --output (Join-Path $env:RUNNER_TEMP 'ku-release-assets') `
            --repo $env:GITHUB_WORKSPACE --version $env:RELEASE_VERSION `
            --target $env:RELEASE_TARGET --commit $env:GITHUB_SHA `
            --metadata $metadataPath --rust-sysroot $sysroot.Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release archive validation failed' }

      - name: Upload the verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ku-release-${{ matrix.target }}
          path: ${{ runner.temp }}/ku-release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-release:
    name: Verify the complete release asset set
    if: github.event_name == 'push'
    needs: [release-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release verification script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the three actual release bundle artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ku-release-*
          path: ${{ runner.temp }}/ku-release-preflight
          merge-multiple: true

      - name: Verify actual artifacts before creating a release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(python3 -c 'import json; print("v" + json.load(open("editors/vscode-ku/package.json", encoding="utf-8"))["version"])')"
          python3 -B .github/scripts/prepare-release.py \
            --assets "$RUNNER_TEMP/ku-release-preflight" \
            --tag "$release_tag" --commit "$GITHUB_SHA" \
            --repo "$GITHUB_WORKSPACE"

  publish-release:
    name: Publish all verified release bundles together
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, borrow-sanitizers, full-tests, release-contract, native, release-bundle, verify-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the release notes and verification script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download only the three release bundle artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ku-release-*
          path: ${{ runner.temp }}/ku-publish-assets
          merge-multiple: true

      - name: Verify exact assets and publish an experimental release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/scripts/prepare-release.py \
            --assets "$RUNNER_TEMP/ku-publish-assets" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --repo "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Ku $GITHUB_REF_NAME (experimental)" \
            --notes-file "$RUNNER_TEMP/ku-publish-assets/RELEASE-NOTES.md"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/ku-publish-assets/"*.tar.gz \
            "$RUNNER_TEMP/ku-publish-assets/"*.manifest.json \
            "$RUNNER_TEMP/ku-publish-assets/SHA256SUMS"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
