            test "$KU_PERFORMANCE_V2_CANDIDATE" = 4e5f5d94da277654862d8679f7ae4a7fda3f05ff
            test "${KU_PERFORMANCE_V2_HTTP_SHORT_SCREEN:-false}" = false
            for mode in PG_DRIVER_SCREEN PG_QUEUE_SCREEN PG_FAILURE_PROBE NORMAL_SELF_PROBE TASK_JSON_SCREEN COMMON_HTTP_SCREEN FINAL_TASK_JSON; do
              mode="KU_PERFORMANCE_V2_$mode"; test "${!mode}" = false
