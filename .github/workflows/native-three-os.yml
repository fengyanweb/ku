name: Native three-OS gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full runs gates; performance-v2 runs core; builds runs compiler; finish runs tail+compiler; validation runs lifecycle+compiler; diagnostic runs short current+Rust attribution; followup-screen runs frozen prepatch/current/Rust'
        type: choice
        default: full
        options: [full, windows-service, windows-pg-host, macos-service, service-recovery, windows-roll, task-main-path, performance-v2, performance-v2-builds, performance-v2-finish, performance-v2-validation, performance-followup-diagnostic, followup-screen]
      prepatch:
        description: 'Full prepatch commit for followup-screen only; blank uses the current frozen 9567271 baseline'
        type: string
        default: ''
      screen_variants:
        description: 'Up to seven full commit ablations, comma-separated, in one serial followup-screen; no extra formal matrix'
        type: string
        default: ''

      reuse_build_run:
        description: 'Optional prior followup build run; reuses verified binaries only, never measurements'
        type: string
        default: ''
      reuse_build_sha256:
        description: 'Exact prior evidence tar SHA256; required with reuse_build_run'
        type: string
        default: ''
      reuse_product_commit:
        description: 'Original product commit inside reused binaries; separate from current measurement tools'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-three-os-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'performance-v2' || inputs.scope == 'performance-v2-builds' || inputs.scope == 'performance-v2-finish' || inputs.scope == 'performance-v2-validation' || inputs.scope == 'performance-followup-diagnostic' || inputs.scope == 'followup-screen') && format('-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Rust format, check and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and lint components
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustup component add rustfmt clippy --toolchain 1.89.0
          rustc --version --verbose

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check every workspace Cargo target
        run: cargo check --locked --workspace --all-targets

      - name: Reject clippy warnings in every workspace Cargo target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install the editor test Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Install VS Code extension dependencies from lockfile
        working-directory: editors/vscode-ku
        run: npm ci

      - name: Test VS Code extension models and formatter
        working-directory: editors/vscode-ku
        run: npm test

      - name: Test release archive validation and license collection
        run: |
          python3 -B .github/scripts/test-export-release.py
          python3 -B .github/scripts/test-prepare-release.py

  borrow-sanitizers:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Native borrow and Task ASan, UBSan and leak checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      KU_CC: "clang -fsanitize=address,undefined -fno-omit-frame-pointer -g -DKU_BORROW_REQUIRE_ASAN"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and require Clang
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          clang --version

      - name: Verify borrowed lifetimes, checked Task and synchronous arithmetic, source-free cleanup
        run: cargo test --locked --test borrow_allocation_test --test borrow_native_test --test native_generic_test --test native_generic_import_test --test native_forward_call_test --test native_temporary_string_method_test --test native_task_join_retry_test --test native_task_frame_c_test --test native_task_control_test --test native_task_driver_test --test native_task_adapter_test --test native_task_wait_test --test native_task_receipt_test --test native_task_cleanup_wait_test --test native_task_source_test --test native_task_source_safety_test --test native_task_start_charge_test --test native_task_start_alias_test --test native_task_start_failure_test --test native_task_start_parameters_test --test native_task_runtime_deadline_test --test native_task_integer_test --test native_task_expression_source_test --test native_task_math_source_test --test native_task_expression_safety_test --test native_task_expression_pending_test --test native_outer_finally_test --test native_error_slot_test --test native_cleanup_catch_test --test native_cleanup_escape_test --test native_template_stream_test --test native_first_cleanup_timeout_test --test native_closure_cleanup_zero_test --test native_closure_drop_test --test native_sync_arithmetic_pilot_test --test native_sync_integer_matrix_test --test native_sync_borrow_arguments_test --test native_sync_map_closure_test --test native_sync_tls_isolation_test --test native_sync_aggregate_owners_test --test native_sync_zero_return_test --test native_task_scope_session_test --test native_task_short_circuit_owner_test --test native_task_exit_bridge_test --test native_task_publishing_deadline_test --test native_task_cleanup_commit_test --test bootstrap_ast_canonical_performance_test --test native_task_scope_frame_test --test native_task_scope_adapter_test --test native_task_empty_scope_adapter_test --test native_task_if_ir_test --test native_task_if_source_test --test native_task_await_progress_test -- --nocapture

      - name: Verify local JSON Task owners, allocation refusal and release under sanitizers
        run: cargo test --locked --test native_task_json_test --test native_task_json_budget_test -- --nocapture --test-threads=1

      - name: Verify synchronous HTTP failure isolation under sanitizers
        run: cargo test --locked --test native_http_test native_sync_arithmetic_http_failure_isolated_and_timeout_keeps_504 -- --nocapture

      - name: Verify HTTP lexical capture and owned response regression under sanitizers
        run: cargo test --locked --test native_http_test native_http_lexical_capture_replay_ -- --nocapture --test-threads=1

      - name: Verify native HTTP async owner, timer and retirement under sanitizers
        run: cargo test --locked --test native_http_test native_http_async_handlers_use_owner_tasks_timers_and_retire_after_timeout -- --exact --nocapture --test-threads=1

      - name: Verify native HTTP async TCP owner waits under sanitizers
        run: cargo test --locked --test native_http_test native_http_async_tcp_waits_share_owner_loops_without_occupying_blocking_worker -- --exact --nocapture --test-threads=1

      - name: Verify JSON UTF-8 boundaries and reactor fd ownership under sanitizers
        run: |
          cargo test --locked --test native_run_test native_json_raw_utf8_boundaries_reject_invalid_bytes_and_release_buffers -- --exact --nocapture --test-threads=1
          cargo test --locked --test native_http_test native_http_persistent_owner_rejects_recycled_events_and_indexes_idle_deadlines -- --exact --nocapture --test-threads=1

      - name: Verify scheduler probe rows and actual cancellation reclamation under sanitizers
        run: cargo test --locked --example native_task_scheduler_probe -- --nocapture --test-threads=1

  task-tsan:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Linux native Task selected-path ThreadSanitizer gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify required TSan runner contracts
        run: python3 -B .github/scripts/test-task-tsan-gate.py

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0

      - name: Require detector self-test and real Task paths
        shell: bash
        run: python3 -B .github/scripts/task-tsan-gate.py --logs "$RUNNER_TEMP/ku-task-tsan"

      - name: Retain exact toolchain, command and bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-task-tsan-evidence
          path: ${{ runner.temp }}/ku-task-tsan
          if-no-files-found: error

  task-main-path:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'task-main-path'
    name: ${{ matrix.os }} Task main-path regressions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      KU_CC: "clang"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and require Clang
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          if [ "$RUNNER_OS" = Linux ]; then
            rustup component add rustfmt clippy --toolchain 1.89.0
          fi
          rustc --version --verbose
          command -v clang
          clang --version

      - name: Check workspace formatting, types and lint on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify all eight guarded-range proof contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --lib backend::c::task_range::tests:: \
            -- --list > "$RUNNER_TEMP/ku-range-tests.list"
          cat "$RUNNER_TEMP/ku-range-tests.list"
          test "$(grep -c '^backend::c::task_range::tests::.*: test$' "$RUNNER_TEMP/ku-range-tests.list")" -eq 8
          cargo test --release --locked --lib backend::c::task_range::tests:: \
            -- --nocapture --test-threads=1

      - name: Verify bounded scalar regions, loop chunks and Copy initialization proofs
        shell: bash
        run: |
          set -euo pipefail
          for task_filter in \
            backend::c::task::scalar_region::tests::regions_ \
            backend::c::task::scalar_region::tests::loops_ \
            backend::c::task::scalar_spill_tests::loop_copy_transfer_
          do
            task_test_list="$RUNNER_TEMP/ku-${task_filter##*::}.list"
            cargo test --release --locked --lib "$task_filter" \
              -- --list > "$task_test_list"
            cat "$task_test_list"
            test "$(grep -c "^${task_filter}.*: test$" "$task_test_list")" -gt 0
            cargo test --release --locked --lib "$task_filter" \
              -- --nocapture --test-threads=1
          done

      - name: Run affected native HTTP and Task regressions serially
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --lib http_short::tests -- --nocapture --test-threads=1
          cargo test --release --locked --test native_run_test \
            native_object_insertion_preserves_collisions_ownership_and_oom -- --exact --nocapture --test-threads=1
          cargo test --release --locked \
            --test native_task_json_test \
            --test native_task_json_budget_test \
            --test native_task_expression_source_test \
            --test native_http_test \
            --test native_task_source_test \
            --test native_task_expression_ir_test \
            --test native_task_control_test \
            --test native_task_driver_test \
            --test native_task_frame_c_test \
            --test native_task_adapter_test \
            --test native_task_cleanup_wait_test \
            --test native_task_cleanup_commit_test \
            --test native_task_scope_frame_test \
            --test native_task_scope_adapter_test \
            --test native_task_empty_scope_adapter_test \
            --test native_task_await_progress_test \
            --test native_task_runtime_deadline_test \
            --test native_task_publishing_deadline_test \
            --test native_task_exit_bridge_test \
            --test native_task_expression_pending_test \
            --test native_task_expression_safety_test \
            --test native_task_join_retry_test \
            --test native_task_receipt_test \
            --test native_task_scope_session_test \
            --test native_task_short_circuit_owner_test \
            --test native_task_source_safety_test \
            --test native_task_start_alias_test \
            --test native_task_start_charge_test \
            --test native_task_start_failure_test \
            --test native_task_start_parameters_test \
            --test native_task_wait_test \
            -- --nocapture --test-threads=1

      - name: Check scalar growth, retained banks, async I/O and reset cleanup with Linux detectors
        if: runner.os == 'Linux'
        shell: bash
        env:
          KU_CC: "clang -fsanitize=address,undefined -fno-omit-frame-pointer -g -DKU_BORROW_REQUIRE_ASAN"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          cargo test --release --locked --test native_task_json_test --test native_task_json_budget_test \
            -- --nocapture --test-threads=1
          cargo test --release --locked --test native_task_source_test native_task_scalar_ \
            -- --nocapture --test-threads=1
          cargo test --release --locked --test native_task_source_test native_task_string_equality_ \
            -- --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test native_http_async_ \
            -- --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test \
            native_http_task_self_wake_keeps_late_work_and_cross_thread_retirement \
            -- --exact --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test \
            native_http_task_io_batch_bounds_frozen_clocks_and_resets_before_every_wait \
            -- --exact --nocapture --test-threads=1
          cargo test --release --locked --test native_task_source_test \
            native_task_guarded_ranges_keep_growth_failures_and_original_error_order \
            -- --exact --nocapture --test-threads=1
          cargo test --release --locked --test native_task_source_test \
            native_task_segments_keep_quantum_limits_and_explicit_intent_boundaries \
            -- --exact --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test \
            native_http_reset_retires_async_work_but_write_half_close_keeps_response \
            -- --exact --nocapture --test-threads=1

          cargo test --release --locked --test native_task_driver_test \
            -- --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test \
            native_http_task_runtime_partial_init_reclaims_binding_and_native_resources \
            -- --exact --nocapture --test-threads=1
          cargo test --release --locked --test native_http_test \
            native_http_task_runtime_blocking_init_timeout_preserves_cleanup_owner \
            -- --exact --nocapture --test-threads=1

      - name: Install the pinned comparison driver toolchain
        if: runner.os == 'Linux'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'

      - name: Check the finite CPU comparison fixtures without a database
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unset BENCH_PG_TEST_URL BENCH_DB_URL
          python3 -m unittest discover -s tests/benchmarks/cross_stack -p test_linux_harness.py
          (
            cd tests/benchmarks/cross_stack/client
            go vet ./...
            go test -race ./...
            go build -trimpath -mod=readonly -o "$RUNNER_TEMP/task-mix-driver" .
          )
          (
            cd tests/benchmarks/cross_stack/go
            go vet -mod=readonly ./...
            go test -race -mod=readonly -timeout 60s ./...
            go build -trimpath -mod=readonly -o "$RUNNER_TEMP/go-reference" .
          )
          (
            cd tests/benchmarks/cross_stack/rust
            cargo fmt --all -- --check
            # The two private live-DB tests stay explicitly ignored.
            cargo test --release --locked -- --nocapture --test-threads=1
          )

  task-main-path-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'task-main-path'
    name: Linux ARM64 normal CLI and matching native link
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      KU_CC: "clang"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and require a native Clang
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustc --version --verbose
          test "$(uname -m)" = aarch64
          command -v clang
          clang --version

      - name: Build the normal CLI and verify its target resolver and host linker
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin ku
          cargo test --release --locked --lib cli::tests::build_target_resolver_ \
            -- --list > "$RUNNER_TEMP/ku-arm64-resolver-tests.list"
          cat "$RUNNER_TEMP/ku-arm64-resolver-tests.list"
          grep -Fx 'cli::tests::build_target_resolver_accepts_host_and_supported_targets: test' "$RUNNER_TEMP/ku-arm64-resolver-tests.list"
          grep -Fx 'cli::tests::build_target_resolver_rejects_path_escape_and_unknown_targets: test' "$RUNNER_TEMP/ku-arm64-resolver-tests.list"
          cargo test --release --locked --lib cli::tests::build_target_resolver_ \
            -- --nocapture --test-threads=1
          cargo test --release --locked --lib \
            cli::tests::explicit_matching_host_target_links_when_a_native_toolchain_is_available \
            -- --list > "$RUNNER_TEMP/ku-arm64-host-link-tests.list"
          cat "$RUNNER_TEMP/ku-arm64-host-link-tests.list"
          grep -Fx 'cli::tests::explicit_matching_host_target_links_when_a_native_toolchain_is_available: test' "$RUNNER_TEMP/ku-arm64-host-link-tests.list"
          cargo test --release --locked --lib \
            cli::tests::explicit_matching_host_target_links_when_a_native_toolchain_is_available \
            -- --exact --nocapture --test-threads=1

      - name: Compile and execute an ARM64 program through the normal CLI
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/ku-task-arm64.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          printf 'fn main(): null! { println(42) return ok(null) }\n' > "$fixture/main.ku"
          target/release/ku --version
          target/release/ku build --native --profile release --target aarch64-linux \
            --offline "$fixture/main.ku" -o "$fixture/program"
          python3 - "$fixture/program" <<'PYCODE'
          import sys
          with open(sys.argv[1], 'rb') as binary:
              header = binary.read(20)
          assert header[:6] == b'\x7fELF\x02\x01', 'expected ELF64 little-endian'
          assert int.from_bytes(header[18:20], 'little') == 183, 'expected AArch64 ELF'
          PYCODE
          "$fixture/program" > "$fixture/actual.txt"
          printf '42\n' | diff -u - "$fixture/actual.txt"

  performance-v2:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'performance-v2' || inputs.scope == 'performance-v2-builds' || inputs.scope == 'performance-v2-finish' || inputs.scope == 'performance-v2-validation' || inputs.scope == 'performance-followup-diagnostic' || inputs.scope == 'followup-screen')
    name: Linux ARM64 serial performance evidence (goal status is separate)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      GOTOOLCHAIN: local
      KU_PERFORMANCE_V2_BASELINE: 956727188a058119fdb3790959063f1496ccb4cc
      KU_PERFORMANCE_V2_SCOPE: ${{ inputs.scope }}
      KU_PERFORMANCE_V2_PREPATCH: ${{ inputs.prepatch || '956727188a058119fdb3790959063f1496ccb4cc' }}
      KU_PERFORMANCE_V2_VARIANTS: ${{ inputs.screen_variants }}
      KU_PERFORMANCE_V2_REUSE_RUN: ${{ inputs.reuse_build_run }}
      KU_PERFORMANCE_V2_REUSE_SHA256: ${{ inputs.reuse_build_sha256 }}
      KU_PERFORMANCE_V2_CANDIDATE: ${{ inputs.reuse_product_commit || github.sha }}

    steps:
      - name: Check out the exact candidate and baseline history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the performance root from the step runtime
        shell: bash
        run: printf 'KU_PERFORMANCE_V2_ROOT=%s\n' "$RUNNER_TEMP/ku-performance-v2" >> "$GITHUB_ENV"

      - name: Verify runner entry contracts without starting workloads
        run: |
          python3 -B -m unittest discover -s tests/benchmarks/cross_stack -p test_compile_variants.py
          python3 -B -m unittest discover -s tests/benchmarks/cross_stack -p test_hosted_cycle.py
          python3 -B -m unittest discover -s tests/benchmarks/cross_stack -p test_reuse_build.py

      - name: Install only the fixed Rust compiler and LLVM profile tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update --component llvm-tools-preview
          rustup default 1.89.0
          rustc --version --verbose

      - name: Install the fixed Go compiler without dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
          check-latest: false

      - name: Prepare bounded tool paths and available native diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends \
            clang-18 llvm-18 lld-18 libpq-dev postgresql-16 libclang-rt-18-dev linux-tools-common
          for performance_perf_package in "linux-tools-$(uname -r)" linux-tools-generic; do
            if apt-cache show "$performance_perf_package" >/dev/null 2>&1; then
              sudo -n apt-get install -y --no-install-recommends "$performance_perf_package"
              break
            fi
          done
          mkdir -p "$KU_PERFORMANCE_V2_ROOT/tools/bin"
          ln -s "${CARGO_HOME:-$HOME/.cargo}" "$KU_PERFORMANCE_V2_ROOT/tools/cargo"
          ln -s "${RUSTUP_HOME:-$HOME/.rustup}" "$KU_PERFORMANCE_V2_ROOT/tools/rustup"
          ln -s "$(go env GOROOT)" "$KU_PERFORMANCE_V2_ROOT/tools/go"
          performance_perf_binary="$(find /usr/lib/linux-tools* -maxdepth 2 -type f -name perf -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$performance_perf_binary" ]; then
            ln -s "$performance_perf_binary" "$KU_PERFORMANCE_V2_ROOT/tools/bin/perf"
          fi
          printf '%s\n' "$KU_PERFORMANCE_V2_ROOT/tools/bin" >> "$GITHUB_PATH"
          test "$(stat -c %u "$KU_PERFORMANCE_V2_ROOT")" = "$(id -u)"
          test "$(stat -c %g "$KU_PERFORMANCE_V2_ROOT")" = "$(id -g)"
          go version

      - name: Download the exact optional prior build archive
        if: inputs.reuse_build_run != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ku-performance-v2-evidence
          path: ${{ runner.temp }}/ku-reused-build
          run-id: ${{ inputs.reuse_build_run }}
          github-token: ${{ github.token }}

      - name: Build frozen sources and plans as the benchmark user
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          performance_build_set=full
          if [ "$KU_PERFORMANCE_V2_SCOPE" = performance-followup-diagnostic ]; then
            performance_build_set=diagnostic
          elif [ "$KU_PERFORMANCE_V2_SCOPE" = followup-screen ]; then
            performance_build_set=followup-screen
          fi
          if [ -n "$KU_PERFORMANCE_V2_REUSE_RUN" ]; then
            test "$performance_build_set" = followup-screen
            python3 -B tests/benchmarks/cross_stack/reuse_build.py \
              --archive "$RUNNER_TEMP/ku-reused-build/ku-performance-v2-evidence.tar.gz" \
              --archive-sha256 "$KU_PERFORMANCE_V2_REUSE_SHA256" \
              --source-run "$KU_PERFORMANCE_V2_REUSE_RUN" \
              --root "$KU_PERFORMANCE_V2_ROOT" --source "$GITHUB_WORKSPACE" \
              --tools "$KU_PERFORMANCE_V2_ROOT/tools" \
              --baseline "$KU_PERFORMANCE_V2_BASELINE" --candidate "$KU_PERFORMANCE_V2_CANDIDATE" \
              --prepatch "$KU_PERFORMANCE_V2_PREPATCH" --screen-variants "$KU_PERFORMANCE_V2_VARIANTS"
          else
            test "$KU_PERFORMANCE_V2_CANDIDATE" = "$GITHUB_SHA"
            test -z "$KU_PERFORMANCE_V2_REUSE_SHA256"
            python3 -B tests/benchmarks/cross_stack/hosted_cycle.py --phase build --build-set "$performance_build_set" \
              --root "$KU_PERFORMANCE_V2_ROOT" --source "$GITHUB_WORKSPACE" \
              --tools "$KU_PERFORMANCE_V2_ROOT/tools" \
              --baseline "$KU_PERFORMANCE_V2_BASELINE" --candidate "$KU_PERFORMANCE_V2_CANDIDATE" \
              --prepatch "$KU_PERFORMANCE_V2_PREPATCH" --screen-variants "$KU_PERFORMANCE_V2_VARIANTS"
          fi

      - name: Run the one serial cgroup cycle and preserve each goal status
        timeout-minutes: 130
        env:
          KU_PERFORMANCE_V2_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          # Dispatch these scopes serially; the distinct groups avoid cancelling an existing run.
          performance_phases=(run)
          performance_build_set=full
          if [ "$KU_PERFORMANCE_V2_SCOPE" = performance-v2-builds ]; then
            performance_phases=(compiler)
          elif [ "$KU_PERFORMANCE_V2_SCOPE" = performance-v2-finish ]; then
            performance_phases=(tail compiler)
          elif [ "$KU_PERFORMANCE_V2_SCOPE" = performance-v2-validation ]; then
            performance_phases=(lifecycle compiler)
          elif [ "$KU_PERFORMANCE_V2_SCOPE" = performance-followup-diagnostic ]; then
            performance_phases=(diagnostic)
            performance_build_set=diagnostic
          elif [ "$KU_PERFORMANCE_V2_SCOPE" = followup-screen ]; then
            performance_phases=(followup-screen)
            performance_build_set=followup-screen
          fi
          for performance_phase in "${performance_phases[@]}"; do
            sudo -n python3 -B tests/benchmarks/cross_stack/hosted_cycle.py --phase "$performance_phase" --build-set "$performance_build_set" \
              --root "$KU_PERFORMANCE_V2_ROOT" --source "$GITHUB_WORKSPACE" \
              --tools "$KU_PERFORMANCE_V2_ROOT/tools" \
              --baseline "$KU_PERFORMANCE_V2_BASELINE" --candidate "$KU_PERFORMANCE_V2_CANDIDATE" \
              --prepatch "$KU_PERFORMANCE_V2_PREPATCH" --screen-variants "$KU_PERFORMANCE_V2_VARIANTS"
          done

      - name: Always archive the allowlisted evidence and goal_status
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 -B tests/benchmarks/cross_stack/hosted_cycle.py --phase archive \
            --root "$KU_PERFORMANCE_V2_ROOT" --source "$GITHUB_WORKSPACE" \
            --tools "$KU_PERFORMANCE_V2_ROOT/tools" \
            --baseline "$KU_PERFORMANCE_V2_BASELINE" --candidate "$KU_PERFORMANCE_V2_CANDIDATE"
          sudo -n chown "$(id -u):$(id -g)" \
            "$KU_PERFORMANCE_V2_ROOT/ku-performance-v2-evidence.tar.gz" "$KU_PERFORMANCE_V2_ROOT/archive.json"

      - name: Retain one short-lived evidence artifact (not a performance pass)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ku-performance-v2-evidence
          path: |
            ${{ runner.temp }}/ku-performance-v2/ku-performance-v2-evidence.tar.gz
            ${{ runner.temp }}/ku-performance-v2/archive.json
          retention-days: 1
          if-no-files-found: error

  full-tests:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'task-main-path' && inputs.scope != 'performance-v2' && inputs.scope != 'performance-v2-builds' && inputs.scope != 'performance-v2-finish' && inputs.scope != 'performance-v2-validation' && inputs.scope != 'performance-followup-diagnostic' && inputs.scope != 'followup-screen')
    name: ${{ matrix.os }} ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'full' && 'resident service follow-up' || 'unfiltered workspace test suite' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'macos-service' && '[{"os":"macos-15","tls_target":"aarch64-apple-darwin"}]' || github.event_name == 'workflow_dispatch' && inputs.scope != 'full' && inputs.scope != 'service-recovery' && '[{"os":"windows-2025","tls_target":"x86_64-pc-windows-msvc"}]' || '[{"os":"windows-2025","tls_target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-24.04","tls_target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","tls_target":"aarch64-apple-darwin"}]') }}
    env:
      CARGO_INCREMENTAL: "0"
      KU_NATIVE_TLS_LINK_REQUIRED: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup component add clippy rustfmt --toolchain 1.89.0
          rustup default 1.89.0
          rustc --version --verbose

      - name: Prepare exact shared database client link inputs on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            default-libmysqlclient-dev libpq-dev pkg-config postgresql haproxy
          source_lib="$(pg_config --libdir)/libpq.so"
          test -e "$source_lib"
          pg_config --version
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-libpq-link.XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.so"
          test -L "$private_lib/libpq.so"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"

          if pkg-config --exists mysqlclient; then
            mysql_module=mysqlclient
            mysql_name=libmysqlclient.so
          elif pkg-config --exists mariadb; then
            mysql_module=mariadb
            mysql_name=libmariadb.so
          else
            echo 'No mysqlclient or mariadb pkg-config module was installed' >&2
            exit 1
          fi
          mysql_libdir="$(pkg-config --variable=libdir "$mysql_module")"
          mysql_include="$(pkg-config --variable=includedir "$mysql_module")"
          pkg-config --modversion "$mysql_module"
          test -e "$mysql_libdir/$mysql_name"
          test -f "$mysql_include/mysql.h" -o -f "$mysql_include/mysql/mysql.h"
          private_mysql="$(mktemp -d "$RUNNER_TEMP/ku-libmysql-link.XXXXXXXX")"
          chmod 700 "$private_mysql"
          ln -s "$mysql_libdir/$mysql_name" "$private_mysql/$mysql_name"
          test -L "$private_mysql/$mysql_name"
          printf 'KU_MYSQL_LIB=%s\n' "$private_mysql" >> "$GITHUB_ENV"
          printf 'KU_MYSQL_INCLUDE=%s\n' "$mysql_include" >> "$GITHUB_ENV"

      - name: Prepare exact shared database client link inputs on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install libpq mysql-client postgresql@17 haproxy
          brew list --versions libpq mysql-client
          source_lib="$(brew --prefix libpq)/lib/libpq.dylib"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-libpq-link.XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.dylib"
          test -L "$private_lib/libpq.dylib"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"

          mysql_prefix="$(brew --prefix mysql-client)"
          mysql_lib="$mysql_prefix/lib/libmysqlclient.dylib"
          mysql_include="$mysql_prefix/include"
          test -e "$mysql_lib"
          test -f "$mysql_include/mysql.h" -o -f "$mysql_include/mysql/mysql.h"
          private_mysql="$(mktemp -d "$RUNNER_TEMP/ku-libmysql-link.XXXXXXXX")"
          chmod 700 "$private_mysql"
          ln -s "$mysql_lib" "$private_mysql/libmysqlclient.dylib"
          test -L "$private_mysql/libmysqlclient.dylib"
          printf 'KU_MYSQL_LIB=%s\n' "$private_mysql" >> "$GITHUB_ENV"
          printf 'KU_MYSQL_INCLUDE=%s\n' "$mysql_include" >> "$GITHUB_ENV"

      - name: Prepare an exact libpq import library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or
              -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) {
            throw "The Windows runner did not provide an absolute PGROOT"
          }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $importLibrary = Join-Path $selected 'lib\libpq.lib'
          $runtimeDirectory = Join-Path $selected 'bin'
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $runtimeDirectory 'libpq.dll') -PathType Leaf)) {
            throw "PGROOT does not contain libpq.lib and libpq.dll"
          }
          (Get-Item -LiteralPath (Join-Path $runtimeDirectory 'libpq.dll')).VersionInfo |
            Format-List FileVersion,ProductVersion
          $privateLib = Join-Path $env:RUNNER_TEMP ("ku-libpq-link-{0}" -f [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateLib | Out-Null
          $privateImport = Join-Path $privateLib 'libpq.lib'
          Copy-Item -LiteralPath $importLibrary -Destination $privateImport
          if (-not (Test-Path -LiteralPath $privateImport -PathType Leaf)) {
            throw 'Failed to create the private libpq import-library copy'
          }
          "KU_PG_LIB=$privateLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_PG_RUNTIME_DIR=$runtimeDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate the exact MySQL client import library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @()
          foreach ($candidate in @($env:MYSQL_ROOT, $env:MYSQL_PATH, 'C:\mysql', 'C:\tools\mysql')) {
            if (-not [string]::IsNullOrWhiteSpace($candidate) -and
                (Test-Path -LiteralPath $candidate -PathType Container)) {
              $item = Get-Item -LiteralPath $candidate
              $roots += $item
              if ($item.Name -ieq 'bin' -and $null -ne $item.Parent) {
                $roots += $item.Parent
              }
            }
          }
          $programFilesMySql = Join-Path $env:ProgramFiles 'MySQL'
          if (Test-Path -LiteralPath $programFilesMySql -PathType Container) {
            $roots += Get-ChildItem -LiteralPath $programFilesMySql -Directory
          }
          $selected = $roots |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\libmysql.lib') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\libmysql.dll') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'include\mysql.h') -PathType Leaf)
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $selected) {
            throw 'No complete MySQL client installation was found'
          }
          $mysqlLib = (Resolve-Path -LiteralPath (Join-Path $selected.FullName 'lib')).Path
          $mysqlInclude = (Resolve-Path -LiteralPath (Join-Path $selected.FullName 'include')).Path
          $mysqlImport = Join-Path $mysqlLib 'libmysql.lib'
          $privateMysql = Join-Path $env:RUNNER_TEMP ("ku-libmysql-link-{0}" -f [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateMysql | Out-Null
          $privateMysqlImport = Join-Path $privateMysql 'libmysql.lib'
          Copy-Item -LiteralPath $mysqlImport -Destination $privateMysqlImport
          if (-not (Test-Path -LiteralPath $privateMysqlImport -PathType Leaf)) {
            throw 'Failed to create the private MySQL import-library copy'
          }
          "KU_MYSQL_LIB=$privateMysql" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_MYSQL_INCLUDE=$mysqlInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_MYSQL_RUNTIME_LIB=$mysqlLib" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mysqlBin = Join-Path $selected.FullName 'bin'
          if (Test-Path -LiteralPath $mysqlBin -PathType Container) {
            $mysqlBin = (Resolve-Path -LiteralPath $mysqlBin).Path
            "KU_MYSQL_RUNTIME_BIN=$mysqlBin" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          (Get-Item -LiteralPath (Join-Path $mysqlLib 'libmysql.dll')).VersionInfo |
            Format-List FileVersion,ProductVersion

      - name: Build Ku CLI
        id: build_ku
        run: cargo build --locked --release --bin ku

      - name: Verify resident deployment budget and rollback contracts
        shell: bash
        run: |
          python3 -B deploy/service/test_manage.py
          python3 -B deploy/service/test_monitor.py
          python3 -B -m unittest discover -s tests/acceptance -p 'test_*.py'

      - name: Build and verify the native TLS target pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packRoot = Join-Path $env:RUNNER_TEMP 'ku-native-tls-pack-v1'
          & ./scripts/build-native-tls-pack.ps1 `
            -Target '${{ matrix.tls_target }}' `
            -OutputRoot $packRoot
          "KU_NATIVE_TLS_PACK=$packRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require a source-free native TLS C consumer
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_net_tls_c_links_runs_without_source_or_pack_and_preserves_binary \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native PostgreSQL client linking and startup
        if: runner.os != 'Windows'
        shell: bash
        env:
          KU_PG_LINK_REQUIRED: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then export LD_BIND_NOW=1; fi
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_BIND_AT_LAUNCH=1; fi
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_pg_client_c_links_and_starts_when_toolchain_and_libpq_are_available \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native PostgreSQL client linking and startup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KU_PG_LINK_REQUIRED: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked --release `
            --test native_run_test `
            native_pg_client_c_links_and_starts_when_toolchain_and_libpq_are_available `
            -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "native PostgreSQL exact-link test failed with exit code $LASTEXITCODE"
          }

      - name: Require native MySQL client linking and startup
        if: runner.os != 'Windows'
        shell: bash
        env:
          KU_MYSQL_LINK_REQUIRED: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then export LD_BIND_NOW=1; fi
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_BIND_AT_LAUNCH=1; fi
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          cargo test --locked --release \
            --test native_run_test \
            native_mysql_client_c_links_and_starts_when_toolchain_and_library_are_available \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$test_log"
          grep -F "test result: ok. 1 passed; 0 failed" "$test_log"

      - name: Require native MySQL client linking and startup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KU_MYSQL_LINK_REQUIRED: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked --release `
            --test native_run_test `
            native_mysql_client_c_links_and_starts_when_toolchain_and_library_are_available `
            -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "native MySQL exact-link test failed with exit code $LASTEXITCODE"
          }

      - name: Reject platform-specific clippy warnings
        if: runner.os != 'Linux' || inputs.scope == 'service-recovery'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run every default test target without stopping at the first failure
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
        run: >-
          cargo test --locked --release --workspace --no-fail-fast
          -- --nocapture --test-threads=2

      - name: Verify focused service and blocking lifecycle regressions
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-service'
        run: >-
          cargo test --locked --release
          --test service_supervision_test --test native_task_adapter_test
          -- --nocapture --test-threads=2

      - name: Verify service control and resident lifecycle regressions
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'service-recovery'
        run: |
          cargo fmt --all -- --check
          cargo test --locked --release --test service_supervision_test -- --nocapture --test-threads=2

      - name: Verify native scheduler probe correctness, not performance
        if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-pg-host' && inputs.scope != 'macos-service' && inputs.scope != 'service-recovery' && inputs.scope != 'windows-roll')
        run: cargo test --locked --release --example native_task_scheduler_probe -- --nocapture --test-threads=1

      - name: Verify resident hard memory provider recovery or explicit platform rejection
        if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-pg-host' && inputs.scope != 'macos-service' && inputs.scope != 'service-recovery' && inputs.scope != 'windows-roll')
        shell: bash
        run: |
          set -euo pipefail
          ku="$PWD/target/release/ku${{ runner.os == 'Windows' && '.exe' || '' }}"
          if [ "$RUNNER_OS" = Linux ]; then
            delegated="/sys/fs/cgroup/ku-service-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo mkdir "$delegated"
            trap 'sudo rmdir "$delegated"' EXIT
            if ! grep -qw memory "$delegated/cgroup.controllers" || ! grep -qw pids "$delegated/cgroup.controllers"; then
              echo 'Dedicated cgroup v2 delegation lacks memory or pids controller; no weaker provider is substituted' >&2
              cat "$delegated/cgroup.controllers"
              exit 1
            fi
            test -z "$(cat "$delegated/cgroup.procs")"
            printf '+memory +pids\n' | sudo tee "$delegated/cgroup.subtree_control" >/dev/null
            sudo chown -R "$(id -u):$(id -g)" "$delegated"
            # This one isolated provider test needs administrator migration
            # rights from the runner's existing cgroup into its private domain.
            sudo env "PATH=$PATH" python3 -B deploy/service/verify.py --memory-only --ku "$ku" \
              --cgroup-root "$delegated" --output "$RUNNER_TEMP/ku-service-memory-provider.json"
          else
            python3 -B deploy/service/verify.py --memory-only --ku "$ku" \
              --output "$RUNNER_TEMP/ku-service-memory-provider.json"
          fi

      - name: Verify native blocking retirement and resident replacement
        if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-pg-host' && inputs.scope != 'macos-service' && inputs.scope != 'service-recovery' && inputs.scope != 'windows-roll')
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/service/verify.py --blocking-only \
            --ku "$PWD/target/release/ku${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --output "$RUNNER_TEMP/ku-native-blocking-retirement.json"

      - name: Verify short native runtime matrix with actual bounded blocking regression
        if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-pg-host' && inputs.scope != 'macos-service' && inputs.scope != 'service-recovery' && inputs.scope != 'windows-roll')
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys
          suffix = '.exe' if os.name == 'nt' else ''
          candidates = [path for path in Path('target/release/deps').glob('native_task_adapter_test-*')
                        if path.is_file() and (path.suffix == '.exe' if os.name == 'nt' else not path.suffix)
                        and os.access(path, os.X_OK)]
          if len(candidates) != 1:
              raise SystemExit(f'Expected one current native_task_adapter_test executable, got {candidates}')
          subprocess.run([sys.executable, '-B', 'tests/acceptance/runtime_matrix.py',
                          '--ku', str(Path('target/release/ku'+suffix).resolve()),
                          '--profile', 'release', '--loops', '1', '2', '4', '--blocking-regression', str(candidates[0].resolve()),
                          '--output', str(Path(os.environ['RUNNER_TEMP'])/'ku-runtime-matrix.json')], check=True)
          PYTHON

      - name: Verify native resident recovery, rolling and rollback through HAProxy
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/service/verify.py \
            --ku "$PWD/target/release/ku" \
            --haproxy "$(command -v haproxy)" \
            --output "$RUNNER_TEMP/ku-resident-service.json"

      - name: Verify real HTTP to PostgreSQL lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          else
            export PATH="$(pg_config --bindir):$PATH"
          fi
          python3 -B tests/acceptance/http_pg_lifecycle.py \
            --ku "$PWD/target/release/ku" --loops 4 \
            --output "$RUNNER_TEMP/ku-http-pg-lifecycle.json"

      - name: Verify real HTTP to PostgreSQL lifecycle on Windows
        if: runner.os == 'Windows' && !cancelled() && steps.build_ku.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-service' && inputs.scope != 'windows-roll')) && (success() || inputs.scope == 'windows-pg-host')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          $env:PATH = (Join-Path $env:PGROOT 'bin') + ';' + $env:PATH
          cargo build --locked --release --example acceptance-runner
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance runner build failed' }
          & (Join-Path $PWD 'target/release/examples/acceptance-runner.exe') 180 python -u -B tests/acceptance/http_pg_lifecycle.py `
            --ku (Join-Path $PWD 'target/release/ku.exe') --loops 4 `
            --output (Join-Path $env:RUNNER_TEMP 'ku-http-pg-lifecycle.json')
          if ($LASTEXITCODE -ne 0) { throw 'HTTP PostgreSQL lifecycle failed' }

      - name: Verify actual isolated Windows host task registration, recovery and stop
        if: runner.os == 'Windows' && !cancelled() && steps.build_ku.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.scope != 'windows-service' && inputs.scope != 'windows-roll')) && (success() || inputs.scope == 'windows-pg-host')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          & python -B deploy/service/verify.py --blocking-only --windows-host-task `
            --ku (Join-Path $PWD 'target/release/ku.exe') `
            --output (Join-Path $env:RUNNER_TEMP 'ku-windows-host-task.json')
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Task Scheduler service acceptance failed' }

      - name: Verify Windows native recovery, rolling and rollback through pinned Caddy
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'windows-roll')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          $caddyRoot = Join-Path $env:RUNNER_TEMP 'ku-caddy-v2.11.7'
          if (Test-Path $caddyRoot) { throw 'Private Caddy acceptance path already exists' }
          New-Item -ItemType Directory -Path $caddyRoot | Out-Null
          try {
            $archive = Join-Path $caddyRoot 'caddy.zip'
            Invoke-WebRequest -Uri 'https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_windows_amd64.zip' -OutFile $archive
            $expected = '0a1edc0b799512051c57071ce0e798d3f2cf67dc98171366f1d2b326072e3b06'
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'Caddy archive SHA256 mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $caddyRoot 'unpacked')
            $caddy = Join-Path $caddyRoot 'unpacked/caddy.exe'
            & $caddy version
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Caddy version query failed' }
            & python -B deploy/service/verify.py --caddy $caddy `
              --ku (Join-Path $PWD 'target/release/ku.exe') `
              --output (Join-Path $env:RUNNER_TEMP 'ku-caddy-service.json')
            if ($LASTEXITCODE -ne 0) { throw 'Windows Caddy recovery, rolling or rollback failed' }
          } finally {
            Remove-Item -LiteralPath $caddyRoot -Recurse -Force
          }

      - name: Retain resident service and PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-lifecycle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ku-resident-service.json
            ${{ runner.temp }}/ku-caddy-service.json
            ${{ runner.temp }}/ku-http-pg-lifecycle.json
            ${{ runner.temp }}/ku-native-blocking-retirement.json
            ${{ runner.temp }}/ku-runtime-matrix.json
            ${{ runner.temp }}/ku-windows-host-task.json
            ${{ runner.temp }}/ku-service-memory-provider.json
          if-no-files-found: error

  release-contract:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: ${{ matrix.os }} release scripts and clean CheckOnly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustc --version --verbose

      - name: Install the release packaging Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Record the release packaging Node runtime
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"

      - name: Snapshot the clean checkout including ignored paths
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/ku-release-checkout-before.txt"
          git -c core.quotepath=false status \
            --porcelain=v1 --untracked-files=all --ignored=matching > "$before"
          if [ -s "$before" ]; then
            cat "$before" >&2
            exit 1
          fi

      - name: Exercise bounded release-process and crash-recovery contracts
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/package-release.ps1 -SelfTest

      - name: Build and validate the archive path without publishing
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/archive-release.ps1 -CheckOnly

      - name: Require CheckOnly to leave tracked, untracked and ignored paths unchanged
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/ku-release-checkout-before.txt"
          after="$RUNNER_TEMP/ku-release-checkout-after.txt"
          git -c core.quotepath=false status \
            --porcelain=v1 --untracked-files=all --ignored=matching > "$after"
          if ! cmp -s "$before" "$after"; then
            diff -u "$before" "$after" >&2
            exit 1
          fi

  native:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: ${{ matrix.target }} native build and run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-windows
            ku_binary: target/release/ku.exe
            python: python
            artifact: native_ci-x86_64-windows.exe
          - os: ubuntu-24.04
            target: x86_64-linux
            ku_binary: target/release/ku
            python: python3
            artifact: native_ci-x86_64-linux.tar
          - os: macos-15
            target: aarch64-darwin
            ku_binary: target/release/ku
            python: python3
            artifact: native_ci-aarch64-darwin.tar
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.89.0 --no-self-update
          rustup default 1.89.0
          rustc --version --verbose

      - name: Build Ku CLI
        run: cargo build --locked --release --bin ku

      - name: Test bounded native verification harness
        run: ${{ matrix.python }} -B .github/scripts/test-verify-native-three-os.py

      - name: Test isolated PostgreSQL fixture safety
        run: ${{ matrix.python }} -B .github/scripts/test-pg-loopback-fixture.py

      - name: Test isolated MySQL fixture safety without database access
        run: ${{ matrix.python }} -B .github/scripts/test-mysql-loopback-fixture.py

      - name: Build and run target-native fixture
        run: >-
          ${{ matrix.python }} .github/scripts/verify-native-three-os.py
          --ku "${{ matrix.ku_binary }}"
          --target "${{ matrix.target }}"
          --artifact-dir "${{ runner.temp }}/ku-native-${{ matrix.target }}"

      - name: Upload verified portable native file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/ku-native-${{ matrix.target }}/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          archive: false

  release-bundle:
    name: ${{ matrix.target }} release download bundle
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the configured publisher toolchain
        shell: pwsh
        run: |
          $toolchain = (Get-Content scripts/release-toolchain.json -Raw | ConvertFrom-Json).toolchain
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Publisher toolchain installation failed' }
          "KU_RELEASE_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - name: Install the release packaging Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-ku/package-lock.json

      - name: Validate the package version and any release tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath editors/vscode-ku/package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'The release package version must be canonical SemVer'
          }
          $tagPattern = '\Av' + [regex]::Escape($version) + '(?:-r[1-9][0-9]{0,8})?\z'
          if ($env:GITHUB_REF_TYPE -ceq 'tag' -and $env:GITHUB_REF_NAME -cnotmatch $tagPattern) {
            throw 'The release tag must match the package version, optionally followed by -rN'
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and verify the actual host bundle
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File scripts/package-release.ps1

      - name: Test the archive exporter on this platform
        run: ${{ matrix.python }} -B .github/scripts/test-export-release.py

      - name: Export a verified source-free archive and third-party notices
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataPath = Join-Path $env:RUNNER_TEMP 'ku-release-cargo-metadata.json'
          $metadata = & cargo +$env:KU_RELEASE_TOOLCHAIN metadata --locked --format-version 1 --filter-platform $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Cannot collect locked Cargo dependency metadata' }
          $metadata | Out-File -FilePath $metadataPath -Encoding utf8
          $sysroot = & rustc +$env:KU_RELEASE_TOOLCHAIN --print sysroot
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate the pinned Rust license materials' }
          & ${{ matrix.python }} -B .github/scripts/export-release.py `
            --bundle (Join-Path $env:GITHUB_WORKSPACE "release/$env:RELEASE_TARGET") `
            --output (Join-Path $env:RUNNER_TEMP 'ku-release-assets') `
            --repo $env:GITHUB_WORKSPACE --version $env:RELEASE_VERSION `
            --target $env:RELEASE_TARGET --commit $env:GITHUB_SHA `
            --metadata $metadataPath --rust-sysroot $sysroot.Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release archive validation failed' }

      - name: Upload the verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ku-release-${{ matrix.target }}
          path: ${{ runner.temp }}/ku-release-assets/*
          if-no-files-found: error
          retention-days: 14

  installed-pg:
    name: ${{ matrix.target }} actual installed CLI PostgreSQL lifecycle
    if: github.event_name == 'push'
    needs: [release-bundle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out the exact archive source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare the existing PostgreSQL fixture tools on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql
          source_lib="$(pg_config --libdir)/libpq.so"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.so"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          pg_config --version

      - name: Prepare the existing PostgreSQL fixture tools on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install libpq postgresql@17
          source_lib="$(brew --prefix libpq)/lib/libpq.dylib"
          test -e "$source_lib"
          private_lib="$(mktemp -d "$RUNNER_TEMP/ku-installed-pg-link-XXXXXXXX")"
          chmod 700 "$private_lib"
          ln -s "$source_lib" "$private_lib/libpq.dylib"
          printf 'KU_PG_LIB=%s\n' "$private_lib" >> "$GITHUB_ENV"
          printf '%s\n' "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix postgresql@17)/bin/pg_config" --version

      - name: Prepare the existing PostgreSQL fixture tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or
              -not [IO.Path]::IsPathFullyQualified($env:PGROOT)) {
            throw 'The Windows runner did not provide an absolute PGROOT'
          }
          $selected = (Resolve-Path -LiteralPath $env:PGROOT).Path
          $importLibrary = Join-Path $selected 'lib\libpq.lib'
          $runtimeDirectory = Join-Path $selected 'bin'
          foreach ($tool in @('pg_config.exe', 'initdb.exe', 'pg_ctl.exe', 'psql.exe', 'libpq.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDirectory $tool) -PathType Leaf)) {
              throw "The selected PostgreSQL install is missing $tool"
            }
          }
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf)) {
            throw 'The selected PostgreSQL install is missing libpq.lib'
          }
          $privateLib = Join-Path $env:RUNNER_TEMP ('ku-installed-pg-link-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $privateLib | Out-Null
          Copy-Item -LiteralPath $importLibrary -Destination (Join-Path $privateLib 'libpq.lib')
          "KU_PG_LIB=$privateLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KU_PG_RUNTIME_DIR=$runtimeDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $runtimeDirectory 'pg_config.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected pg_config failed' }

      - name: Verify current-run artifact bytes and installed sync/async PG lifecycles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath editors/vscode-ku/package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          & ${{ matrix.python }} -B .github/scripts/verify-installed-pg.py `
            --repo $env:GITHUB_WORKSPACE --version $version `
            --target '${{ matrix.target }}' --commit $env:GITHUB_SHA `
            --output (Join-Path $env:RUNNER_TEMP 'ku-installed-pg.json')
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed CLI PostgreSQL acceptance failed' }

      - name: Retain bounded installed-archive PG evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-pg-${{ matrix.target }}
          path: ${{ runner.temp }}/ku-installed-pg*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove the owned PostgreSQL import-library link directory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:KU_PG_LIB)) {
            $parent = [IO.Path]::GetFullPath((Split-Path -Path $env:KU_PG_LIB -Parent))
            $expected = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $leaf = Split-Path -Path $env:KU_PG_LIB -Leaf
            if ($parent -ne $expected -or $leaf -notlike 'ku-installed-pg-link-*') {
              throw 'Refusing to clean an unowned PostgreSQL import-library path'
            }
            Remove-Item -LiteralPath $env:KU_PG_LIB -Recurse -Force
          }

  verify-release:
    name: Verify the complete release asset set
    if: github.event_name == 'push'
    needs: [release-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release verification script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the three actual release bundle artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ku-release-*
          path: ${{ runner.temp }}/ku-release-preflight
          merge-multiple: true

      - name: Verify actual artifacts before creating a release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(python3 -c 'import json; print("v" + json.load(open("editors/vscode-ku/package.json", encoding="utf-8"))["version"])')"
          python3 -B .github/scripts/prepare-release.py \
            --assets "$RUNNER_TEMP/ku-release-preflight" \
            --tag "$release_tag" --commit "$GITHUB_SHA" \
            --repo "$GITHUB_WORKSPACE"

  publish-release:
    name: Publish all verified release bundles together
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, borrow-sanitizers, task-tsan, full-tests, release-contract, native, release-bundle, verify-release, installed-pg]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the release notes and verification script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download only the three release bundle artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ku-release-*
          path: ${{ runner.temp }}/ku-publish-assets
          merge-multiple: true

      - name: Verify exact assets and publish an experimental release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .github/scripts/prepare-release.py \
            --assets "$RUNNER_TEMP/ku-publish-assets" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --repo "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Ku $GITHUB_REF_NAME（实验预发行版）" \
            --notes-file "$RUNNER_TEMP/ku-publish-assets/RELEASE-NOTES.md"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/ku-publish-assets/"*.tar.gz \
            "$RUNNER_TEMP/ku-publish-assets/"*.manifest.json \
            "$RUNNER_TEMP/ku-publish-assets/SHA256SUMS"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
