name: Native three-OS gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full runs gates; performance-v2 runs core; builds runs compiler; finish runs tail+compiler; validation runs lifecycle+compiler; diagnostic runs short current+Rust attribution; followup-screen runs frozen prepatch/current/Rust'
        type: choice
        default: full
        options: [full, windows-service, windows-pg-host, macos-service, service-recovery, windows-roll, task-main-path, windows-task-main-path, http-short-proof, performance-v2, performance-v2-builds, performance-v2-finish, performance-v2-validation, performance-followup-diagnostic, followup-screen, pg-input-lifetime, pg-input-guard, pg-input-windows, pg-typed-self, arena-residency, poll-budget-contract]
      prepatch:
        description: 'Full prepatch commit for explicit paired screens; wake/PG probes require their frozen baseline'
        type: string
        default: ''
      screen_variants:
        description: 'Up to seven full commit ablations, comma-separated, in one serial followup-screen; no extra formal matrix'
        type: string
        default: ''
      task_json_screen:
        description: 'Explicit separate native Task JSON screen (followup-screen only); false preserves the normal PG/HTTP screen'
        type: boolean
        default: false

      common_http_screen:
        description: 'Explicit 55-window shared HTTP screen; requires followup-screen and task_json_screen, keeps separate B/BT admission'
        type: boolean
        default: false

      final_task_json:
        description: 'Separate formal Task JSON15-window supplement; performance-v2 only, preserves original80/16, fresh full build required'
        type: boolean
        default: false

      pg_failure_probe:
        description: 'One PG12800 failure observation; performance-followup-diagnostic only, fresh normal build, no matrix or perf'
        type: boolean
        default: false

      normal_self_probe:
        description: 'Six normal B/R JSON before/sample/after windows; fresh diagnostic build, minimal SELF only, no acceptance'
        type: boolean
        default: false

      http_short_screen:
        description: 'Three A environment controls then20 normal single-candidate HTTP A/B windows; diagnostic only'
        type: boolean
        default: false

      http_short_goal:
        description: 'Preregistered HTTP short-screen target; ignored when the screen is not selected'
        type: choice
        default: cpu
        options: [cpu, memory]

      memory_owner_probe:
        description: 'One diagnostic startup-owner map; requires fixed41182804290 normal build reuse, no score or matrix'
        type: boolean
        default: false

      pg_driver_screen:
        description: 'Two fresh normal B PG sender conditions256/1024; diagnostic arrival ledger, no capacity ranking'
        type: boolean
        default: false

      pg_queue_screen:
        description: 'Eight normal A/B PG fix windows; frozen f39c673 prepatch, no perf/matrix/capacity claim'
        type: boolean
        default: false

      reuse_build_run:
        description: 'Optional prior followup build run; reuses verified binaries only, never measurements'
        type: string
        default: ''
      reuse_build_sha256:
        description: 'Exact prior evidence tar SHA256; required with reuse_build_run'
        type: string
        default: ''
      reuse_product_commit:
        description: 'Original product commit inside reused binaries; separate from current measurement tools'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-three-os-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'performance-v2' || inputs.scope == 'performance-v2-builds' || inputs.scope == 'performance-v2-finish' || inputs.scope == 'performance-v2-validation' || inputs.scope == 'performance-followup-diagnostic' || inputs.scope == 'followup-screen' || inputs.scope == 'pg-input-lifetime' || inputs.scope == 'pg-input-guard' || inputs.scope == 'pg-input-windows' || inputs.scope == 'pg-typed-self' || inputs.scope == 'arena-residency' || inputs.scope == 'poll-budget-contract') && format('-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

jobs:
  poll-budget-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'poll-budget-contract'
    name: ${{ matrix.os }} HTTP poll-budget contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            cc: clang-18 -O2
          - os: windows-2025
            cc: clang -O2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      KU_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: d05ca1551d4585011499d81d0ae828c4173306ff
          persist-credentials: false
      - name: Install the fixed check compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
          fi
          mkdir -p "$RUNNER_TEMP/poll-budget"
          git rev-parse HEAD > "$RUNNER_TEMP/poll-budget/product-commit.txt"
          rustc +1.99.1 -vV > "$RUNNER_TEMP/poll-budget/rustc.txt"
      - name: Check only startup accounting, backend snapshots and real loop shutdown
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/poll-budget"
          run_exact() {
            cargo +1.99.1 test --release --locked --test "$1" "$2" -- --exact --nocapture > "$out/$2.log" 2>&1
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$out/$2.log"
          }
          if [ "$RUNNER_OS" = Linux ]; then
            run_exact native_http_startup_test native_http_owner_budget_counts_only_storage_used_by_its_poll_backend
          fi
          run_exact native_http_startup_test native_http_early_loop_startup_failures_retire_on_the_original_thread
          run_exact native_http_test native_http_dense_slots_preserve_iteration_and_reject_stale_poll_snapshots
          if [ "$RUNNER_OS" = Linux ]; then
            run_exact native_http_test native_http_persistent_owner_rejects_recycled_events_and_indexes_idle_deadlines
          fi
          run_exact native_http_test native_http_fixed_loops_share_limits_authenticate_control_and_drain
          if [ "$RUNNER_OS" = Linux ]; then
            KU_CC='clang-18 -O2 -fsanitize=address,undefined -fno-omit-frame-pointer' ASAN_OPTIONS='detect_leaks=1:halt_on_error=1' UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
              cargo +1.99.1 test --release --locked --test native_http_startup_test native_http_owner_budget_counts_only_storage_used_by_its_poll_backend -- --exact --nocapture > "$out/budget-detectors.log" 2>&1
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$out/budget-detectors.log"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ku-poll-budget-${{ matrix.os }}
          path: ${{ runner.temp }}/poll-budget
          retention-days: 14

  arena-residency:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'arena-residency'
    name: Linux ARM64 normal Release arena residency question
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install only existing binary dependencies and bounded debugger
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 libpq-dev postgresql-16 gdb
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ku-pg-input-guard-full
          path: ${{ runner.temp }}/arena-download
          run-id: 41582847043
          github-token: ${{ github.token }}
      - name: Verify the unchanged default A and driver without building or importing scores
        shell: bash
        env:
          PYTHONPATH: tests/benchmarks/cross_stack
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from types import SimpleNamespace
          import reuse_build
          a=SimpleNamespace(root=Path(os.environ['RUNNER_TEMP'])/'arena-cache',source=Path(os.environ['GITHUB_WORKSPACE']),
              baseline='166453a1d2768bbce19796d9c7823be73cc84ccb',prepatch='166453a1d2768bbce19796d9c7823be73cc84ccb',
              candidate='5857373ef316c9b67789141038a93b46e62a2f20',screen_variants=[],pg_input_guard=True)
          reuse_build.prepare_pg_input_guard_cache(
              Path(os.environ['RUNNER_TEMP'])/'arena-download/ku-performance-v2-evidence.tar.gz',a)
          PY
      - name: Answer only live versus retained allocator pages
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 -B tests/benchmarks/cross_stack/normal_arena_read.py \
            --root "$RUNNER_TEMP/arena-read" --manifest "$RUNNER_TEMP/arena-cache/A/manifest.json" \
            > "$RUNNER_TEMP/arena-read.log" 2>&1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ku-normal-arena-residency
          path: |
            ${{ runner.temp }}/arena-read/evidence
            ${{ runner.temp }}/arena-read.log
            ${{ runner.temp }}/arena-cache/verified-baseline-cache.json
          retention-days: 14
          if-no-files-found: warn

  pg-typed-self:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pg-typed-self'
    name: Linux ARM64 current Rust1.99.1 typed PG caller attribution
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      KU_PG_PRODUCT: d05ca1551d4585011499d81d0ae828c4173306ff
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Reuse the existing compiler, paths and software sampler setup
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 libpq-dev postgresql-16 linux-tools-common
          for pg_perf_package in "linux-tools-$(uname -r)" linux-tools-generic; do
            if apt-cache show "$pg_perf_package" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pg_perf_package"
              break
            fi
          done
          mkdir -p "$RUNNER_TEMP/ku-pg-current-tools/bin" "$RUNNER_TEMP/ku-pg-current-1.99.1"
          pg_perf_binary="$(readlink -e "/usr/lib/linux-tools/$(uname -r)/perf" || true)"
          if [ -z "$pg_perf_binary" ] || [ ! -x "$pg_perf_binary" ]; then
            pg_perf_binary="$(find -L /usr/lib/linux-tools* /usr/lib/linux-azure-tools* -maxdepth 2 -type f -name perf -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          test -n "$pg_perf_binary"; test -x "$pg_perf_binary"
          ln -s "$pg_perf_binary" "$RUNNER_TEMP/ku-pg-current-tools/bin/perf"
          ln -s "${CARGO_HOME:-$HOME/.cargo}" "$RUNNER_TEMP/ku-pg-current-tools/cargo"
          ln -s "${RUSTUP_HOME:-$HOME/.rustup}" "$RUNNER_TEMP/ku-pg-current-tools/rustup"
          ln -s "$(dirname "$(dirname "$(command -v go)")")" "$RUNNER_TEMP/ku-pg-current-tools/go"
          printf 'KU_PG_CURRENT_BUILD=%s\n' "$RUNNER_TEMP/ku-pg-current-1.99.1" >> "$GITHUB_ENV"
          printf 'KU_PG_CURRENT_ROOT=%s\n' "$RUNNER_TEMP/ku-pg-current-observation" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/ku-pg-current-tools/bin" >> "$GITHUB_PATH"
      - name: Restore the already cached Rust1.99.1 source build archive
        id: pg_typed_archive_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ku-pg-guard-build-cache
          key: ku-pg-baseline-d05-rust1.99.1-2f1163c34bd45ad4172acf28f1a94f38f7b382a271ba99c6469592beb0744142
      - name: Download the identified build archive only if the cache is absent
        if: steps.pg_typed_archive_restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ku-pg-current-build-rust1.99.1
          path: ${{ runner.temp }}/ku-pg-guard-build-cache
          run-id: 41630973206
          github-token: ${{ github.token }}
      - name: Verify original normal and typed builds without importing measurements
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tests/benchmarks/cross_stack python3 -B - <<'PYIN'
          import os
          from pathlib import Path
          import reuse_build
          paths=reuse_build.prepare_current_typed_pg_cache(
              Path(os.environ['RUNNER_TEMP'])/'ku-pg-guard-build-cache/ku-pg-current-1.99.1/ku-performance-v2-evidence.tar.gz',
              Path(os.environ['KU_PG_CURRENT_BUILD']),Path(os.environ['GITHUB_WORKSPACE']))
          print({name:str(path) for name,path in paths.items()})
          PYIN
      - name: Validate the exact fp sampling format on this boot
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 -B tests/benchmarks/cross_stack/typed_pg_self.py --preflight --callchains \
            --root "$KU_PG_CURRENT_BUILD" --tools "$RUNNER_TEMP/ku-pg-current-tools" --current-product "$KU_PG_PRODUCT"
      - name: Observe only the previously missing typed PG caller question
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 -B tests/benchmarks/cross_stack/typed_pg_self.py --callchains \
            --root "$KU_PG_CURRENT_ROOT" --tools "$RUNNER_TEMP/ku-pg-current-tools" \
            --normal-manifest "$KU_PG_CURRENT_BUILD/B/manifest.json" --typed-manifest "$KU_PG_CURRENT_BUILD/BP/manifest.json" \
            --current-product "$KU_PG_PRODUCT" --preflight-root "$KU_PG_CURRENT_BUILD" --only BP > "$RUNNER_TEMP/ku-pg-current-observation.log" 2>&1
      - name: Preserve the existing build and observation archive formats
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          for pg_current_root in "$RUNNER_TEMP/ku-pg-current-observation"; do
            if [ -d "$pg_current_root" ]; then
              sudo -n python3 -B - "$GITHUB_WORKSPACE/tests/benchmarks/cross_stack" "$pg_current_root" "$(id -u)" "$(id -g)" <<'PY'
          import sys
          from pathlib import Path
          from types import SimpleNamespace
          sys.path.insert(0,sys.argv[1])
          import hosted_cycle
          print(hosted_cycle.archive(SimpleNamespace(root=Path(sys.argv[2])),dict(uid=int(sys.argv[3]),gid=int(sys.argv[4]))))
          PY
            fi
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ku-pg-current-build-reuse
          path: |
            ${{ runner.temp }}/ku-pg-current-1.99.1/verified-typed-pg-cache.json
            ${{ runner.temp }}/ku-pg-current-1.99.1/prepared-current.json
            ${{ runner.temp }}/ku-pg-current-1.99.1/reuse-provenance
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ku-pg-typed-self
          path: |
            ${{ runner.temp }}/ku-pg-current-observation/ku-performance-v2-evidence.tar.gz
            ${{ runner.temp }}/ku-pg-current-observation/archive.json
            ${{ runner.temp }}/ku-pg-current-observation/kernel.*
            ${{ runner.temp }}/ku-pg-current-observation.log
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ku-pg-current-core
          path: |
            ${{ runner.temp }}/ku-pg-current-observation/summary.json
            ${{ runner.temp }}/ku-pg-current-observation/results.json
            ${{ runner.temp }}/ku-pg-current-observation/frozen-plan.json
            ${{ runner.temp }}/ku-pg-current-observation/identity.json
            ${{ runner.temp }}/ku-pg-current-observation/kernel.*
            ${{ runner.temp }}/ku-pg-current-observation/kernel-identity.json
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/window.json
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/client.json
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/perf-self.log
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/perf-pcs.log
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/export-receipt.json
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/normal-self-observations.json
            ${{ runner.temp }}/ku-pg-current-observation/inputs/**/*.c
            ${{ runner.temp }}/ku-pg-current-observation/inputs/**/bin/ku-server
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/maps.log
            ${{ runner.temp }}/ku-pg-current-observation/normal-self-probe/**/symbol-identities.json
          retention-days: 14
          if-no-files-found: warn

  pg-input-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pg-input-guard'
    name: Linux ARM64 ordinary PG net-registration relative guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      KU_PG_BASELINE: d05ca1551d4585011499d81d0ae828c4173306ff
      KU_PG_CANDIDATE: e9d619af2f1061d8ec826c736eecbddcfee6a05a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install only the fixed compiler and request driver
        shell: bash
        run: |
          set -euo pipefail
          printf 'KU_PG_GUARD_ROOT=%s\n' "$RUNNER_TEMP/ku-pg-input-guard" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 libclang-rt-18-dev libpq-dev postgresql-16
      - name: Restore the exact baseline archive bytes
        id: pg_guard_archive_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ku-pg-guard-build-cache
          key: ku-pg-baseline-d05-rust1.99.1-2f1163c34bd45ad4172acf28f1a94f38f7b382a271ba99c6469592beb0744142
      - name: Reuse the verified Rust1.99.1 baseline and request driver
        if: steps.pg_guard_archive_restore.outputs.cache-hit != 'true'
        id: pg_guard_archive_download
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ku-pg-current-build-rust1.99.1
          path: ${{ runner.temp }}/ku-pg-guard-build-cache
          run-id: 41630973206
          github-token: ${{ github.token }}
      - name: Keep the downloaded archive for the next stage
        if: ${{ always() && steps.pg_guard_archive_download.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ku-pg-guard-build-cache
          key: ${{ steps.pg_guard_archive_restore.outputs.cache-primary-key }}
      - name: Verify cache and seed build steps without any old scores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KU_PG_GUARD_ROOT/tools/bin"
          ln -s "${CARGO_HOME:-$HOME/.cargo}" "$KU_PG_GUARD_ROOT/tools/cargo"
          ln -s "${RUSTUP_HOME:-$HOME/.rustup}" "$KU_PG_GUARD_ROOT/tools/rustup"
          PYTHONPATH=tests/benchmarks/cross_stack python3 -B - <<'PY'
          import os
          from pathlib import Path
          from types import SimpleNamespace
          import reuse_build
          a=SimpleNamespace(root=Path(os.environ['KU_PG_GUARD_ROOT']),source=Path(os.environ['GITHUB_WORKSPACE']),
              baseline=os.environ['KU_PG_BASELINE'],prepatch=os.environ['KU_PG_BASELINE'],
              candidate=os.environ['KU_PG_CANDIDATE'],screen_variants=[],pg_input_guard=True)
          reuse_build.prepare_pg_input_guard_cache(
              Path(os.environ['RUNNER_TEMP'])/'ku-pg-guard-build-cache/ku-pg-current-1.99.1/ku-performance-v2-evidence.tar.gz',a,source_run='41630973206')
          PY
      - name: Restore only Rust1.99.1 candidate Cargo state
        id: pg_guard_cargo_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/ku-pg-input-guard/cli-cache-1.99.1
            ~/.cargo/registry
            ~/.cargo/git
          key: ku-pg-guard-rust1.99.1-linux-arm64-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ku-pg-guard-rust1.99.1-linux-arm64-${{ hashFiles('Cargo.lock') }}-
      - name: Finalize the verified frozen build identities
        id: pg_guard_prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/benchmarks/cross_stack/hosted_cycle.py --phase build --build-set diagnostic --pg-input-guard --root "$KU_PG_GUARD_ROOT" --source "$GITHUB_WORKSPACE" --tools "$KU_PG_GUARD_ROOT/tools" --baseline "$KU_PG_BASELINE" --candidate "$KU_PG_CANDIDATE" --prepatch "$KU_PG_BASELINE" > "$KU_PG_GUARD_ROOT/build.log" 2>&1
      - name: Save the successful candidate build before checks and scoring
        if: ${{ always() && steps.pg_guard_prepare.outcome == 'success' && steps.pg_guard_cargo_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/ku-pg-input-guard/cli-cache-1.99.1
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.pg_guard_cargo_restore.outputs.cache-primary-key }}
      - name: Check the affected reactor and ordinary Task network contracts
        timeout-minutes: 5
        shell: bash
        env:
          KU_CC: clang-18 -O2
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$KU_PG_GUARD_ROOT/cli-cache-1.99.1"
          export KU_BIN="$KU_PG_GUARD_ROOT/B/build/ku-cargo/release/ku"
          cd "$KU_PG_GUARD_ROOT/B/src"
