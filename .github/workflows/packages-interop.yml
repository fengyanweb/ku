name: Installed packages and interop

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'scripts/install-runtime-from-source.py'
      - 'examples/interop-native/**'
      - 'tests/acceptance/*interop.py'
      - '.github/scripts/runtime-bundle.py'
      - '.github/workflows/packages-interop.yml'
  push:
    branches: [main, 'codex/packages-interop']

permissions:
  contents: read

concurrency:
  group: packages-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    name: Installed package consumer (${{ matrix.rust-host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust-host: x86_64-unknown-linux-gnu
          - os: macos-15
            rust-host: aarch64-apple-darwin
          - os: windows-2025
            rust-host: x86_64-pc-windows-msvc
          - os: windows-2025
            rust-host: x86_64-pc-windows-gnu

    env:
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
      - name: Select the Windows GNU C and C++ drivers
        if: matrix.rust-host == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $cc = (Get-Command gcc.exe -ErrorAction Stop).Source
          $cxx = (Get-Command g++.exe -ErrorAction Stop).Source
          if ((& $cc -dumpmachine) -notmatch '^x86_64-w64-mingw32') {
            throw "Expected x64 MinGW GCC at $cc"
          }
          "KU_CC=$cc" >> $env:GITHUB_ENV
          "KU_INTEROP_CC=$cc" >> $env:GITHUB_ENV
          "KU_INTEROP_CXX=$cxx" >> $env:GITHUB_ENV
      - name: Build and install the matching CLI and SDK from source
        shell: pwsh
        env:
          TARGET: ${{ matrix.rust-host }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rust = (python -B .github/scripts/runtime-bundle.py toolchain --repo .).Trim()
          $toolchain = "$rust-$env:TARGET"
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Required compiler installation failed' }
          $sdk = Join-Path $env:RUNNER_TEMP 'ku-sdk'
          python -B scripts/install-runtime-from-source.py --prefix $sdk --rust-host $env:TARGET
          if ($LASTEXITCODE) { throw 'Source CLI and SDK installation failed' }
          $leaf = if ($IsWindows) { 'ku.exe' } else { 'ku' }
          "INSTALLED_KU=$(Join-Path $sdk $leaf)" >> $env:GITHUB_ENV
      - name: Consume a public Git package and previously unknown C SDK
        shell: pwsh
        run: |
          python -B tests/acceptance/packages_interop.py --ku $env:INSTALLED_KU --public-git
          if ($LASTEXITCODE) { throw 'Installed package smoke test failed' }
      - name: Run actual C, C++, Python and wheel consumers in all three engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $wanted = Get-Content -LiteralPath examples/interop-native/expected.txt
          $source = Join-Path $env:RUNNER_TEMP 'native-providers'
          python -B examples/interop-native/prepare.py $source
          if ($LASTEXITCODE) { throw 'Pinned native sources could not be prepared' }
          Push-Location $source
          try {
            foreach ($dependency in './vendor/sqlite_example','./vendor/tinyxml_example') {
              & $env:INSTALLED_KU i $dependency
              if ($LASTEXITCODE) { throw "Native package install failed for $dependency" }
            }
            $got = & $env:INSTALLED_KU run --locked
            if ($LASTEXITCODE -or (Compare-Object $wanted $got -SyncWindow 0)) { throw 'Interpreter output differed' }
            $suffix = if ($IsWindows) { '.exe' } else { '' }
            & $env:INSTALLED_KU build --backend runner --release --locked -o "delivery/run$suffix"
            if ($LASTEXITCODE) { throw 'Explicit Runner build failed' }
            $build = & $env:INSTALLED_KU build --release --locked -o "delivery/native$suffix"
            if ($LASTEXITCODE -or -not ($build -like 'native c ok:*')) { throw 'Default native build failed' }
            Move-Item -LiteralPath delivery -Destination (Join-Path $env:RUNNER_TEMP 'native-delivery')
          } finally {
            Pop-Location
          }
          Rename-Item -LiteralPath $source -NewName 'native-providers-removed'
          foreach ($entry in "run$suffix", "native$suffix") {
            $exe = Join-Path $env:RUNNER_TEMP "native-delivery/$entry"
            $got = & $exe
            if ($LASTEXITCODE -or (Compare-Object $wanted $got -SyncWindow 0)) { throw "Moved native provider output differed for $entry" }
          }
          python -B tests/acceptance/python_interop.py --ku $env:INSTALLED_KU --wheels
          if ($LASTEXITCODE) { throw 'Python package consumption failed' }
