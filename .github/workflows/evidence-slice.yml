name: Read-only archived evidence slice

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed fengyanweb/ku run containing ku-performance-v2-evidence (decimal ID)
        type: string
        required: true
      include_normal_self_probe:
        description: Include existing normal SELF raw samples, maps and selected libpq/libc/loader/libm ELF snapshots
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check read-only archive parser contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-slice-logs" "$RUNNER_TEMP/evidence-slice-output"
          python3 -B -m unittest discover -s tests/benchmarks/cross_stack -p test_evidence_slice.py \
            2>&1 | tee "$RUNNER_TEMP/evidence-slice-logs/contracts.log"

      - name: Bind decimal source run and exact artifact to same-repository Actions metadata
        id: source
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/benchmarks/cross_stack/evidence_slice.py metadata \
            --source-run "$SOURCE_RUN" --output "$RUNNER_TEMP/evidence-slice-logs/source-actions.json" \
            2>&1 | tee "$RUNNER_TEMP/evidence-slice-logs/metadata.log"

      - name: Download only the bound existing evidence artifact on this runner
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          repository: fengyanweb/ku
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/evidence-slice-input
          merge-multiple: true

      - name: Verify complete archive map and export byte-exact selected evidence
        env:
          INCLUDE_NORMAL_SELF: ${{ inputs.include_normal_self_probe }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [ "$INCLUDE_NORMAL_SELF" = true ]; then
            options+=(--include-normal-self-probe)
          fi
          python3 -B tests/benchmarks/cross_stack/evidence_slice.py slice \
            --archive "$RUNNER_TEMP/evidence-slice-input/ku-performance-v2-evidence.tar.gz" \
            --receipt "$RUNNER_TEMP/evidence-slice-input/archive.json" \
            --metadata "$RUNNER_TEMP/evidence-slice-logs/source-actions.json" \
            --output "$RUNNER_TEMP/evidence-slice-output/ku-evidence-slice.tar.gz" "${options[@]}" \
            2>&1 | tee "$RUNNER_TEMP/evidence-slice-logs/slice.log"

      - name: Retain verified compact slice (existing evidence, no performance progress)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ku-evidence-slice
          path: ${{ runner.temp }}/evidence-slice-output/ku-evidence-slice.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Retain read-only transfer logs even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ku-evidence-slice-logs
          path: ${{ runner.temp }}/evidence-slice-logs
          retention-days: 1
          if-no-files-found: error
