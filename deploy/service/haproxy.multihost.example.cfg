# Replace the private addresses with two actual authorized hosts. Each host
# runs its own two-instance + spare deployment from cluster.example.json.
# This file alone is not evidence of a cross-host recovery or database RPO.
global
    maxconn 8192
defaults
    mode http
    retries 0
    no option redispatch
    timeout connect 1s
    timeout client 5s
    timeout server 5s
    timeout http-request 2s
frontend public
    bind 127.0.0.1:18000
    # For Internet service, terminate TLS at the existing edge/load balancer.
    # This checked reference intentionally uses HTTP on a private network.
    http-request deny deny_status 404 if { path_beg /__ku/ }
    http-request del-header X-Ku-Control-Token
    default_backend ku_hosts
backend ku_hosts
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server host_a 10.0.0.11:18080 check inter 500ms fall 2 rise 1 maxconn 2048 maxqueue 64
    server host_b 10.0.0.12:18080 check inter 500ms fall 2 rise 1 maxconn 2048 maxqueue 64
