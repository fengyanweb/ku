[package]
name = "ku-native-http-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
ureq = { version = "=2.12.1", default-features = true }
url = "=2.5.8"

rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.7"
flate2 = "=1.1.9"

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "ring"] }
