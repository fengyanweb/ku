[package]
name = "ku-cross-stack-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]
resolver = "3"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
deadpool-postgres = "=0.14.2"
tokio-postgres = "=0.7.18"
