[package]
name = "ku"
version = "0.0.16"
edition = "2021"
rust-version = "1.89"

[workspace]
members = ["crates/ku-native-tls"]
resolver = "2"

[dependencies]
chrono = "0.4"
ed25519-dalek = "2"
getrandom = "0.3"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12", default-features = true }
url = "2.5"
zeroize = "1"
zstd = "0.13"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[target.'cfg(windows)'.dependencies]
# 0.61 links Windows SDK import libraries directly. The older 0.52 release
# required a Cargo-build-script-only windows.0.52.0.lib search path, which is
# unavailable when `ku build` invokes rustc for its self-contained runner.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
